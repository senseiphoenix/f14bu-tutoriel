{id:"d1", title:"Le radar : modes et vocabulaire",
 intro:"Le Tomcat est un intercepteur avant d'être un chasseur : le radar est l'arme principale, le missile n'est que la conséquence. Cette leçon te donne le vocabulaire qui te servira dans toutes les suivantes.",
 body:[
  {t:"h", v:"Deux familles, un compromis"},
  {t:"p", v:"L'AN/AWG-9 fonctionne en pulse ou en pulse doppler. Le pulse voit dans toutes les directions, même une cible qui te fait face à vitesse nulle relative, mais il se noie dans le fouillis au sol et porte moins loin. Le pulse doppler porte beaucoup plus loin en se filtrant sur la vitesse relative de la cible — au prix d'un angle mort sur les cibles qui n'ont presque pas de vitesse de rapprochement (le fameux « notch »)."},
  {t:"table", head:["Mode","Fonction","Portée typique"], rows:[
   ["Recherche pulse","Recherche moyenne portée, secondaire air-sol.","60 nm"],
   ["Poursuite pulse (P-STT)","Poursuite ferme courte-moyenne portée.","50 nm"],
   ["Recherche pulse doppler","Recherche longue portée.","110 nm"],
   ["Recherche avec télémétrie","Recherche longue portée avec distance.","90 nm"],
   ["Poursuite sur passage (TWS)","Longue portée, plusieurs pistes, guidage AIM-54.","90 nm"],
   ["Poursuite doppler (PD STT)","Poursuite ferme longue portée, tous les missiles.","90 nm"]]},
  {t:"note", k:"", lbl:"Ce que ça veut dire pour toi", v:"En pratique tu vivras surtout dans deux modes : <b>TWS</b> pour surveiller et engager plusieurs pistes à la fois avec le Phoenix, et <b>PD STT</b> quand tu dois verrouiller fermement une cible pour un Sparrow, un Sidewinder guidé, ou un tir canon assisté."},
  {t:"h", v:"Le panneau qui commande tout"},
  {t:"p", v:"Le DDD, côté RIO, concentre les réglages : taille de cible attendue (petite/normale/grande — ça change la portée d'activation du missile), filtrage du fouillis, gain, et surtout les <b>voyants de poursuite</b> : ANT TRK (l'antenne suit l'angle), RDROT (la cible est dans la porte de distance), qui te disent si ton verrouillage est solide ou fragile."},
  {t:"img", k:"ddd", c:"Le DDD — panneau de contrôle radar principal côté RIO."},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Mission d'entraînement avec quelques appareils neutres à détecter, sans tirer.",
   "Passe en recherche pulse doppler, repère un contact, note son comportement sur le DDD.",
   "Fais-le passer en poursuite (STT) et observe les voyants ANT TRK et RDROT s'allumer.",
   "Repasse en TWS et regarde plusieurs pistes coexister.",
   "Note le vocabulaire dans tes mots : recherche, poursuite, TWS, STT."]},
  {t:"note", k:"go", lbl:"Validation", v:"Tu détectes, poursuis et identifies un contact à 40 nm sans stress, et tu sais dire dans quel mode tu es."},
  {t:"src", v:["manuel"]}
]},

{id:"d2", title:"Lire le PTID",
 intro:"Le PTID est ton centre de conscience tactique pour tout le reste de la section. Il porte trois pages principales et une page tactique dense en informations — cette leçon te donne les repères pour t'y retrouver sans t'y perdre.",
 body:[
  {t:"h", v:"Trois pages, un seul écran"},
  {t:"p", v:"Le PTID s'organise autour de trois pages : la <b>page tactique</b> pour le combat, la <b>page navigation en ligne</b> (NVD PLT) pour tracer des zones d'intérêt, et la <b>page navigation par point</b> (NVD WP) pour consulter le détail d'un waypoint. Vingt boutons-poussoirs numérotés entourent l'écran ; leur fonction change selon la page affichée."},
  {t:"img", k:"ptid", c:"Vue d'ensemble du PTID."},
  {t:"h", v:"La page tactique, ce qui compte vraiment"},
  {t:"p", v:"C'est la page que tu vois le plus souvent en vol. Voici les éléments qui orientent réellement tes décisions, pas la totalité des vingt-six repères du manuel."},
  {t:"tbl", head:["Élément","Ce qu'il te dit"], rows:[
   ["Source de donnée (SNSR / OWN A/C / TGT 1)","Quelles données tu regardes : capteur brut, ton propre avion, ou une piste précise."],
   ["Mode PTID (ASTB / GSTB / ATTK)","L'état général d'affichage — attaque, stabilisé air ou stabilisé sol."],
   ["Échelle de portée","Le rayon réellement couvert par l'écran. Change ce que tu vois radicalement."],
   ["Mode de guidage (case en bas)","DEST, TACAN ou MAN — la source qui pilote ton HUD. Le premier endroit à vérifier si le cap affiché te surprend."],
   ["Mode radar affiché","Le mode radar actuellement commandé par le RIO."],
   ["BT / BA","Distance du Bullseye à la cible (BT) et à ton propre avion (BA) — la référence commune de toute la patrouille."],
   ["Point EGI (« Hot-Dog »)","Le point vers lequel l'EGI te guide en ce moment — reconnaissable à son symbole particulier."]]},
  {t:"note", k:"", lbl:"Piste brute et piste ferme", v:"Une piste <b>brute</b> est un simple contact détecté — pas assez de données pour un tir guidé. Une piste <b>ferme</b>, en poursuite radar établie, porte le vecteur et la distance nécessaires au calcul de la zone de tir. C'est cette distinction qui décide si tu peux tirer."},

  {t:"h", v:"Le guidage : quatre sources, un seul sélecteur"},
  {t:"p", v:"Le bouton-poussoir 9 <span class='bindtag unbound' title='Pas de bind HOTAS : action à la souris/VR dans le cockpit'>Clic cockpit</span> fait défiler les sources de guidage disponibles, dans cet ordre : les options EGI (<b>AUTO / MAN / OFLY / CDNU</b> — une seule est proposée selon ce qui est réglé sur la page plan de vol du CDNU), puis <b>DEST</b> (le point de destination), puis <b>LP / TGT</b> (guidage vers une arme guidée par GPS — LP si le mode Computer Pilot est choisi sur l'ACP, TGT si Manuel l'est)."},
  {t:"tbl", head:["Sélection","Comportement"], rows:[
   ["AUTO","Réglé sur le CDNU. Le guidage s'active dès sélection sur le PTID ; l'enchaînement des points se poursuit quoi que tu affiches."],
   ["OFLY","Même logique qu'AUTO mais avec survol exact du point avant d'enchaîner."],
   ["MAN","Le guidage s'active à la sélection, mais rien n'enchaîne automatiquement."],
   ["TGT / LP","Cible ou point de largage d'une arme GPS, selon le mode choisi sur l'ACP. La station de la prochaine arme à tirer s'affiche."]]},

  {t:"h", v:"La page AWL — atterrissage tous temps"},
  {t:"p", v:"Cette page affiche l'incidence, la vitesse verticale, et les aiguilles ILS ou ACLS selon ce que tu accroches. C'est la page que tu ouvres en approche du bateau — elle sert de base à la section C."},
  {t:"note", k:"warn", lbl:"Effet de bord à connaître", v:"L'AWL est chargée depuis la bande magnétique, exactement comme le programme air-sol. <b>Charger l'AWL décharge automatiquement le programme air-sol</b>, et réciproquement. Tu ne peux pas avoir les deux en mémoire en même temps."},

  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Ouvre le PTID en vol, avec des contacts présents.",
   "Change l'échelle de portée et observe l'effet sur ce qui s'affiche.",
   "Fais défiler les sources de guidage avec PB9 et observe le HUD changer en même temps.",
   "Identifie une piste brute puis fais-la passer en piste ferme.",
   "Note ce que tu vois réellement dans ton cockpit, avec tes propres mots."]},
  {t:"note", k:"go", lbl:"Validation", v:"Tu énonces la situation tactique du PTID en cinq secondes de lecture, et tu sais faire défiler les sources de guidage sans hésiter."},
  {t:"src", v:["manuel"]}
]},

{id:"d3", title:"Le HUD en air-air",
 intro:"Le HUD te permet de rester tête haute pendant tout l'engagement. Chaque arme sélectionnée change la symbologie affichée — cette leçon te montre les trois versions que tu croiseras le plus.",
 body:[
  {t:"h", v:"Ce qui ne change jamais"},
  {t:"p", v:"Quel que soit le mode, tu retrouves toujours : le repère de trajectoire (FPM, qui indique où l'avion va réellement, pas où il pointe), l'échelle de cap, l'incidence, le Mach et le facteur de charge, et en bas à droite la donnée de navigation vers ton point actif."},
  {t:"note", k:"", lbl:"FPM contre repère de montée", v:"En manœuvre dynamique, le repère de trajectoire (FPM) peut sortir du champ visible du HUD et disparaître un instant. Le <b>repère de montée/descente (CDM)</b> reste alors ta seule référence de trajectoire — c'est pour ça qu'il existe. Le bouton HUD CAGE <span class='bindtag' data-bind-cmd='CAGE-SEAM button'></span> bascule entre les deux."},

  {t:"h", v:"Air-air contre Phoenix ou Sparrow — poursuite sur passage"},
  {t:"p", v:"En TWS avec un Phoenix sélectionné, chaque piste porte un numéro d'ordre de tir. Une piste accrochée affiche des moustaches et l'indication <b>SHOOT</b> quand la solution est valide."},
  {t:"tbl", head:["Repère","Signification"], rows:[
   ["Boîte de désignation, avec numéro d'ordre","Chaque cible suivie en TWS, dans l'ordre où tu les engageras."],
   ["BT / BA","Distance du Bullseye à la cible accrochée et à toi-même."],
   ["VC / VR","Vitesse de rapprochement et vitesse radiale de la cible."],
   ["BRG / RNG / ALT","Relèvement, distance et altitude de la cible accrochée."],
   ["Repère de zone de tir (LRD)","La zone où le missile sélectionné peut être tiré efficacement."],
   ["Légende d'armement","L'arme sélectionnée (PH pour Phoenix, SP pour Sparrow). Barrée d'une croix si MASTER ARM est sur OFF ou TNG."]]},

  {t:"h", v:"Air-air Sidewinder — poursuite ferme"},
  {t:"p", v:"Avec un AIM-9 sélectionné, un cercle apparaît au centre de la boîte de désignation : c'est la position du viseur infrarouge du missile. Un cercle <b>plein</b> indique que le mode d'accrochage étendu (SEAM) est activé."},
  {t:"h", v:"Le canon — viseur directeur"},
  {t:"p", v:"Sélectionner GUN au manche avec le mode A/A actif affiche une croix de tir. Sans accrochage radar, le viseur bascule sur un mode manuel classique (LCOS). Un repère t'indique quand la cible entre dans la portée du canon."},

  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Verrouille un contact ami en poursuite ferme et observe la boîte de désignation apparaître au HUD.",
   "Passe en TWS avec un Phoenix sélectionné et observe les numéros d'ordre de tir sur plusieurs pistes.",
   "Sélectionne l'AIM-9 et repère le cercle de position du viseur infrarouge.",
   "Vole une interception complète en ne regardant que le HUD, du contact radar jusqu'au passage."]},
  {t:"note", k:"go", lbl:"Validation", v:"Interception complète tête haute, sans regarder la planche de bord, en sachant nommer chaque repère selon l'arme sélectionnée."},
  {t:"src", v:["manuel"]}
]},

{id:"d4", title:"Sidewinder et canon",
 intro:"On commence par les armes les plus simples : autonomes après le déclenchement, sans guidage à tenir. C'est là qu'on apprend les bases de la solution de tir avant de compliquer avec les missiles radar.",
 body:[
  {t:"h", v:"Préparer l'AIM-9"},
  {t:"p", v:"Le refroidissement du viseur infrarouge doit être activé avant tir — il devient prêt immédiatement mais met environ 60 secondes à atteindre sa pleine performance. Une fois prêt, le mode normal (SEAM) laisse le viseur balayer autour de ta ligne de visée ou de ta cible verrouillée, dans un champ de 40° ; le mode boresight le fige strictement sur l'axe de l'avion, en 2,5° seulement."},
  {t:"img", k:"armpanel", c:"Panneau d'armement (ACP), console verticale gauche du RIO"},
  {t:"tbl", head:["N°","Commande","Fonction"], rows:[
   ["1","WPN TYPE","Type d'arme employée — configure le calculateur d'armes pour les calculs balistiques air-sol.","—rio"],
   ["2","ATTK MODE","Mode d'attaque air-sol : TGT, CMPTR/IP, CMPTR/PLT, MAN, D/L BOMB.","—rio"],
   ["3","ELEC FUZE","Fusée électrique : SAFE, VT (air-burst), INST, DLY 1, DLY 2.","—rio"],
   ["4","A/G GUN","<span class='pos'><b>OFF</b> — canon désactivé. &nbsp;·&nbsp; <b>MIXED</b> — canon disponible en plus de l'arme air-sol sélectionnée.</span>","—rio"],
   ["5","QTY","Quantité de munitions larguées à chaque commande de tir, roquettes comprises.","—rio"],
   ["6","INTERVAL","Intervalle entre largages successifs en mode rafale (ripple), en millisecondes.","—rio"],
   ["7","STA SEL 6","Sélectionne la station 6 pour largage ou jettison.","—rio"],
   ["8","A/A LAUNCH","Permet au RIO de commander le tir d'un AIM-7 ou AIM-54. S'illumine quand les conditions de tir (hot-trigger) sont réunies.","—rio"],
   ["9","MSL SPD GATE","Règle la porte de vitesse missile utilisée par le calculateur d'armes.","—rio"],
   ["10","STA SEL 8","<span class='pos'><b>B</b> — pylône inférieur. &nbsp;·&nbsp; <b>SW</b> — non fonctionnel.</span>","—rio"],
   ["11","MSL OPTIONS","Active le mode pulse-doppler pour l'AIM-7, ou le mode de tir actif pour l'AIM-54.","—rio"],
   ["12","STA SEL 5","Sélectionne la station 5 pour largage ou jettison.","—rio"],
   ["13","NEXT LAUNCH","Désigne la cible actuellement accrochée comme prochaine cible de tir, en TWS.","—rio"],
   ["14","STA SEL 4","Sélectionne la station 4 pour largage ou jettison.","—rio"],
   ["15","STA SEL 1","<span class='pos'><b>B</b> — pylône inférieur. &nbsp;·&nbsp; <b>SW</b> — non fonctionnel.</span>","—rio"],
   ["16","TANK JETT 7","Sélectionne le bidon externe de la station 7 pour largage.","—rio"],
   ["17","TANK JETT 2","Sélectionne le bidon externe de la station 2 pour largage.","—rio"],
   ["18","STA SEL 3","Sélectionne la station 3 pour largage ou jettison.","—rio"],
   ["19","JETT OPTIONS","<span class='pos'><b>WPNS</b> — largue les armes seules. &nbsp;·&nbsp; <b>MER/TER</b> — largue aussi les râteliers. Non fonctionnel dans le module.</span>","—rio"],
   ["20","SEL JETT","<span class='pos'><b>JETT</b> — mode de largage normal. &nbsp;·&nbsp; <b>AUX</b> — mode de secours, sous cache.</span>","—rio"],
   ["21","MECH FUZE","<span class='pos'><b>NOSE</b> — arme la fusée de nez. &nbsp;·&nbsp; <b>SAFE</b> — inhibe l'armement. &nbsp;·&nbsp; <b>NOSE/TAIL</b> — arme les deux fusées.</span>","—rio"],
   ["22","DLVY MODE","Deux sélecteurs combinés : <b>SGL/PRS</b> (simple ou paire d'armes) et <b>STP/RPL</b> (pas à pas ou rafale selon QTY et INTERVAL).","—rio"]]},
  {t:"note", k:"", lbl:"Les combinaisons DLVY MODE", v:"<b>STP+SGL</b> : une arme par pression de la détente. <b>STP+PRS</b> : une paire par pression — uniquement pour les stations jumelées (1↔8, 3↔6, 4↔5). <b>RPL+SGL</b> : une rafale de QTY armes espacées d'INTERVAL. <b>RPL+PRS</b> : la même rafale, par paires."},
  {t:"note", k:"", lbl:"Le son qui te guide", v:"Un grondement grave signifie que le viseur balaie sans trouver de source infrarouge. Un sifflement aigu signifie qu'il regarde une source chaude. C'est ce sifflement que tu attends avant de presser la détente."},
  {t:"h", v:"Le canon"},
  {t:"p", v:"Sans verrouillage radar, tu n'as que le réticule brut : pas de portée, seulement une solution de tête. Avec un verrouillage — même bref — tu obtiens portée, vitesse de rapprochement et solution complète. Rafales courtes : les munitions sont limitées."},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Active le refroidissement AIM-9, attends la pleine performance.",
   "Trois tirs sur cible non manœuvrante en mode SEAM, à courte distance.",
   "Trois tirs sur cible manœuvrante — sens la différence de fenêtre de tir.",
   "Passe au canon : un engagement sans verrouillage radar, un autre avec.",
   "Note tes distances de tir réussies pour chaque arme."]},
  {t:"note", k:"go", lbl:"Validation", v:"Trois cibles abattues consécutivement, au moins une au canon."},
  {t:"src", v:["manuel"]}
]},

{id:"d5", title:"Sparrow",
 intro:"Le Sparrow t'oblige à tenir ton verrouillage pendant tout le vol du missile. C'est l'école de la discipline de tir : rien n'est automatique après le départ.",
 body:[
  {t:"h", v:"Le principe du guidage semi-actif"},
  {t:"p", v:"Le Sparrow ne « voit » pas sa cible : il suit l'énergie radar que ton avion réfléchit dessus. Concrètement, ça veut dire que <b>ton radar doit rester verrouillé sur la cible jusqu'à l'impact</b>. Si tu romps le lock, le missile perd son guidage et devient inutile."},
  {t:"h", v:"Deux modes"},
  {t:"p", v:"En mode normal, avec un verrouillage ferme (STT), le WCS peut guider en continu ou en pulse doppler selon le modèle de missile. En mode boresight, le radar illumine simplement tout ce qui se trouve dans l'axe — utile en dernier recours si le verrouillage se perd, car le radar bascule automatiquement sur ce mode quand la cible est perdue, te laissant une chance de repêcher le tir."},
  {t:"img", k:"acm", c:"Panneau ACM, au panneau central"},
  {t:"tbl", head:["N°","Commande","Fonction et positions"], rows:[
   ["1","MASTER ARM","Autorise le tir et les largages sélectifs.<span class='pos'><b>OFF</b> — circuits de tir non alimentés.<br><b>ON</b> — circuits alimentés, cache à relever.<br><b>TNG</b> — mode entraînement en vol.</span>","Master arm on and cover open"],
   ["2","HUD CAGE","Choisit le symbole affiché au HUD.<span class='pos'>Décagé : <b>vecteur vitesse</b> (FPM). &nbsp;·&nbsp; Cagé : <b>repère de montée/descente</b> (CDM).</span>","CAGE-SEAM button"],
   ["3","L FIRE / R FIRE","S'allument à la détection d'un feu dans le moteur correspondant."],
   ["4","Cache ACM / ACM JETT","Relever le cache active le mode ACM et donne accès au largage ACM des emports sélectionnés (jamais les Sidewinder).","ACM Jettison"],
   ["5","SEAM LOCK","S'allume pendant la tentative d'accrochage Sidewinder (4,5 s) et reste allumé si l'autodirecteur accroche."],
   ["6","COLLISION","Indique que le guidage en collision est sélectionné en poursuite ferme."],
   ["7","HOT TRIG","S'allume quand les conditions de tir sont réunies : appuyer sur la détente tirera."]]},
  {t:"note", k:"warn", lbl:"Deux verrouillages à connaître", v:"Le bus MASTER ARM est asservi à la poignée de train : <b>train sorti, aucun tir</b> sauf largage d'urgence. En sens inverse, le largage ACM et le largage d'urgence ne sont <b>pas</b> bloqués par MASTER ARM."},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Verrouillage ferme sur une cible, vérifie le domaine de tir affiché au HUD (Rmin/Rmax).",
   "Tire, et <b>maintiens le verrouillage</b> pendant tout le vol du missile — ne romps rien, ne désengage rien.",
   "Recommence sur une cible manœuvrante : sens à quel point il est facile de perdre le lock en la suivant.",
   "Exercice : deux tirs successifs sur deux cibles séparées, en changeant de verrouillage entre les deux.",
   "Note ta portée de tir réussie et ce qui t'a fait perdre le lock, le cas échéant."]},
  {t:"note", k:"warn", lbl:"Piège", v:"Manœuvrer trop fort juste après le tir : tu perds l'antenne sur la cible et le missile part pour rien."},
  {t:"note", k:"go", lbl:"Validation", v:"Deux tirs sur trois au but, sur cible manœuvrante."},
  {t:"src", v:["manuel"]}
]},

{id:"d6", title:"Phoenix et tir multi-cibles",
 intro:"L'arme qui rend le Tomcat unique : tirer loin, sur plusieurs cibles, avant même d'être vu. C'est aussi l'arme la plus longue à préparer et la plus facile à gâcher si on la tire trop tôt.",
 body:[
  {t:"h", v:"Portées réelles"},
  {t:"p", v:"Contre une cible de la taille d'un chasseur, en altitude et en poursuite doppler ferme, compte au moins 60 nm de portée. En TWS contre plusieurs cibles à la fois, ça descend vers 50 nm. Si tu tires en mode actif d'entrée (le missile cherchant seul dès le départ), la portée s'effondre à environ 10 nm — c'est un mode de dernier recours, pas une tactique standard."},
  {t:"h", v:"Préparation"},
  {t:"p", v:"Comme le Sparrow, le Phoenix doit être préparé et accordé avant tir — environ deux minutes pour que les voyants de statut passent à « prêt ». Ne néglige pas ce délai dans ta planification d'engagement."},
  {t:"img", k:"weapons", c:"Vue d'ensemble de l'armement — les Phoenix sur leurs rails fuselage."},
  {t:"h", v:"Le principe du guidage"},
  {t:"p", v:"En TWS, jusqu'à six Phoenix peuvent être guidés simultanément vers six cibles différentes. Le missile part semi-actif — guidé par ton radar — puis bascule en <b>autonome</b> (guidage radar actif embarqué) une fois assez proche de sa cible. Ce basculement n'est pas automatique dans l'absolu : c'est ton radar qui commande le passage en mode actif. Si ce signal n'arrive jamais, le missile continue en semi-actif jusqu'au bout — ce qui veut dire qu'il n'est <b>pas vraiment « tire et oublie »</b> tant qu'il n'a pas basculé."},
  {t:"note", k:"", lbl:"Ce que ça implique pour toi", v:"Tu dois garder ta piste TWS active jusqu'à ce que le missile devienne autonome, pas juste jusqu'au moment du tir. Rompre le suivi trop tôt prive le missile de ses mises à jour de trajectoire."},
  {t:"h", v:"Tir multi-cibles"},
  {t:"p", v:"En TWS, tu assignes un missile à chaque piste voulue, tu tires en séquence, et tu maintiens le tableau de pistes actif pendant que les missiles convergent. C'est la manœuvre signature du Tomcat : rester en dehors de portée adverse tout en engageant plusieurs appareils."},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Prépare tes Phoenix (deux minutes d'avance sur ton engagement prévu).",
   "Tir sur cible unique à longue distance, en gardant le suivi radar actif jusqu'à l'impact.",
   "Passe en TWS avec deux ou trois cibles, assigne et tire en séquence.",
   "Note tes portées réelles observées — elles varient nettement avec l'altitude, la vitesse de tir et la manœuvre de la cible."]},
  {t:"note", k:"warn", lbl:"Piège", v:"Tirer au maximum théorique sur une cible manœuvrante : elle a largement le temps de se dérober avant l'impact. Réserve les longues portées aux cibles qui ne savent pas qu'elles sont visées."},
  {t:"note", k:"go", lbl:"Validation", v:"Deux cibles engagées simultanément en TWS, au moins une abattue."},
  {t:"src", v:["manuel"]}
]},

{id:"d7", title:"BFM : le Tomcat au manche",
 intro:"Dernière leçon de la section : le combat tournoyant. Le Tomcat est lourd mais ses ailes immenses le rendent redoutable à basse vitesse — à condition de ne pas gaspiller son énergie dans le premier virage.",
 body:[
  {t:"h", v:"Gérer l'énergie"},
  {t:"p", v:"Chaque virage soutenu coûte de la vitesse. La question permanente en combat tournoyant n'est pas « puis-je tourner plus fort » mais « ai-je les moyens de le faire maintenant ». Le DFCS (section A) t'aide à sentir la limite, mais l'énergie, elle, ne se récupère qu'en ligne droite ou en piqué."},
  {t:"img", k:"csurf", c:"Position des gouvernes — utile pour voir tes propres entrées en combat."},
  {t:"img", k:"aoa", c:"L'indexeur d'incidence — ton limiteur de virage en combat serré, comme en approche."},
  {t:"h", v:"Manœuvres de base"},
  {t:"p", v:"Le virage soutenu à facteur de charge constant est ta manœuvre par défaut. Le tonneau barriqué casse une poursuite en te déplaçant latéralement sans perdre trop d'énergie. La mise en travers extrême réduit ta vitesse brutalement pour faire dépasser un poursuivant — dangereux si mal jugé, redoutable sinon."},
  {t:"h", v:"Défensif"},
  {t:"p", v:"En défensif, ton premier travail est de détecter la menace le plus tôt possible — c'est pour ça que le RWR (section E) et le fait de regarder dehors comptent autant que le pilotage. Une fois la menace identifiée, casse la solution de tir adverse par un virage franc vers elle, pas en t'éloignant."},
  {t:"img", k:"rwr", c:"Indicateur ALR-67 — ta première ligne de défense en combat"},
  {t:"tbl", head:["Bande","Contenu"], rows:[
   ["Critique (intérieure)","Menaces directes : capables de t'engager <b>et</b> montrant l'intention de le faire."],
   ["Létale","Systèmes capables de t'engager, mais qui ne le font pas actuellement."],
   ["Non létale (extérieure)","Émetteurs sans menace immédiate — par distance ou absence d'armement."]]},
  {t:"p", v:"Le détail du cercle d'état central et des codes de priorisation est traité en section Survivre."},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Combat contre un adversaire de niveau facile, en offensif : garde l'énergie, ne tire pas sur le manche au premier virage.",
   "Même exercice en défensif : détecte, réagis, casse la solution.",
   "Combat contre un adversaire plus manœuvrant : accepte de perdre longtemps avant de trouver ton ouverture.",
   "Note ce qui t'a coûté le plus d'énergie, et à quel moment tu aurais dû rompre plutôt qu'insister."]},
  {t:"note", k:"go", lbl:"Validation", v:"Tu tiens deux minutes en défensif face à un adversaire plus manœuvrant sans être abattu. Tu es prêt pour la section E."},
  {t:"src", v:["manuel"]}
]},

]}

{id:"e1", title:"Lire le RWR",
 intro:"Le détecteur d'alerte radar (ALR-67) est ta première ligne de défense : il te dit qui t'illumine, d'où, et avec quelle intention. Savoir le lire en un coup d'œil vaut tous les leurres du monde.",
 body:[
  {t:"h", v:"Trois bandes, classées par danger — pas par distance"},
  {t:"p", v:"L'écran s'organise en trois bandes concentriques. Ce qui les sépare n'est <b>pas</b> la distance réelle de l'émetteur, mais son niveau de menace."},
  {t:"tbl", head:["Bande","Contenu"], rows:[
   ["Critique (la plus intérieure)","Menaces directes : un système capable de t'engager <b>et</b> qui montre son intention de le faire maintenant."],
   ["Létale","Systèmes capables de t'engager, mais qui ne le font pas actuellement."],
   ["Non létale (la plus extérieure)","Émetteurs sans menace immédiate — par distance ou parce qu'ils n'ont pas d'armement."]]},
  {t:"note", k:"go", lbl:"Le réflexe qui en découle", v:"Un symbole dans la bande <b>critique</b> passe toujours avant un symbole plus proche de toi mais relégué en bande non létale. Réagis à la priorité affichée, pas à la position visuelle sur l'écran."},
  {t:"img", k:"rwrRio", c:"Panneau de commande du RWR côté RIO : alimentation, type de menaces affichées, volume."},

  {t:"h", v:"Le cercle central : l'état du système"},
  {t:"p", v:"Un cercle au centre de l'écran se lit en trois zones, chacune pouvant afficher une lettre de code."},
  {t:"tbl", head:["Zone","Code","Signification"], rows:[
   ["Haut gauche","N","Priorisation normale (par défaut)."],
   ["","I","Chasseurs prioritaires."],
   ["","A","Artillerie anti-aérienne prioritaire."],
   ["","U","Émetteurs inconnus prioritaires."],
   ["","F","Les émetteurs amis s'affichent en plus des menaces."],
   ["Haut droit","(vide)","Mode limité non sélectionné."],
   ["","L","Mode limité : seules les six menaces prioritaires s'affichent."],
   ["Bas","(vide)","Fonctionnement normal."],
   ["","B","Échec du test intégré."],
   ["","T","Surchauffe."],
   ["","O","Affichage décalé : les menaces superposées sont séparées pour rester lisibles, au prix d'un gisement moins précis."]]},

  {t:"h", v:"Trois niveaux d'urgence par le son"},
  {t:"table", head:["Signal","Sens","Ta réaction"], rows:[
   ["Recherche","Un radar balaie ta zone, sans te suivre.","Noter la direction, continuer la mission."],
   ["Poursuite","Un radar te suit spécifiquement.","Préparer une réaction : cap, altitude, programme de leurres."],
   ["Tir / guidage","Un missile est probablement en vol vers toi.","Réagir immédiatement : manœuvre + leurres. C'est maintenant."]]},
  {t:"img", k:"rwrPlt", c:"Répétiteur RWR côté pilote."},

  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Mission avec des radars sol actifs mais hors de portée de tir. Survole la zone en écoutant et regardant le RWR.",
   "Associe chaque son à ce que tu vois à l'écran : recherche, poursuite, tir.",
   "Repère un symbole en bande critique et un autre en bande non létale, et vérifie que tu réagis d'abord au premier.",
   "Règle le volume pour que l'alerte de tir soit impossible à rater sans que la recherche te fatigue.",
   "Note les symboles des menaces de ta mission et leur signification."]},
  {t:"note", k:"go", lbl:"Validation", v:"Tu identifies le type, la bande et la direction d'une menace au son, avant même de regarder l'écran en détail."},
  {t:"src", v:["manuel"]}
]},
{id:"e2", title:"L'ALE-47 : leurres programmés",
 intro:"Le B(U) emporte l'AN/ALE-47, un système de contre-mesures programmable. La philosophie est claire : tu ne largues pas au hasard sous le stress, tu déclenches des programmes préparés à froid.",
 body:[
  {t:"h", v:"Ce qui a changé"},
  {t:"p", v:"L'ALE-47 se pilote via deux panneaux sur la console droite du RIO : l'unité d'affichage (DCDU) et le programmateur. Les programmes de largage — combien de paillettes ou de fusées, à quelle cadence, sur quelle durée — peuvent être préparés avant le vol, y compris chargés depuis l'éditeur de mission via la cartouche de données (MDL), la même qui transporte tes plans de vol."},
  {t:"img", k:"rconsole", c:"Console droite du RIO — les panneaux ALE-47 (DCDU et programmateur) s'y trouvent."},
  {t:"img", k:"decm", c:"Panneau DECM — le brouilleur, complémentaire des leurres."},
  {t:"h", v:"Trois programmes types à préparer"},
  {t:"table", head:["Situation","Logique du programme"], rows:[
   ["Missile radar","Paillettes en salve, cadence rapide, couplées à une manœuvre dans le plan horizontal pour sortir du filtrage doppler."],
   ["Missile infrarouge","Fusées espacées sur plusieurs secondes, le temps de casser l'accrochage pendant que tu changes de vecteur."],
   ["Dégagement","Programme mixte plus long, pour couvrir une sortie de zone défendue."]]},
  {t:"note", k:"", lbl:"Le principe qui rend tout efficace", v:"Un leurre sans manœuvre ne sauve presque jamais. Le programme donne au missile un faux choix ; c'est ta manœuvre qui rend le mauvais choix crédible. Les deux ensemble, toujours."},
  {t:"h", v:"Côté déclenchement"},
  {t:"p", v:"Les commandes de largage restent accessibles aux deux équipiers : le pilote a son bouton de contre-mesures <span class='bindtag' data-bind-cmd='DLC Toggle / Countermeasure Dispense'></span> (celui que tu as bindé en section A), et le RIO ses interrupteurs — largage unitaire ou lancement du programme sélectionné. En pratique avec JESTER, tu déclenches toi-même et il gère la sélection des programmes si tu le lui demandes."},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Au sol, explore le DCDU et le programmateur ALE-47 avec le click-to-explain : identifie où se lisent les quantités restantes et le programme sélectionné.",
   "Prépare (ou fais préparer via l'éditeur de mission) tes trois programmes types.",
   "En vol, déclenche chaque programme à blanc et vérifie ce qui sort : type, cadence, durée.",
   "Note tes programmes ci-dessous : contenu exact et situation d'emploi. C'est ta carte de survie personnelle."]},
  {t:"note", k:"warn", lbl:"Piège", v:"Vider tout son stock sur la première alerte. Les leurres sont une ressource de mission : un programme adapté en consomme peu et en garde pour le retour."},
  {t:"note", k:"go", lbl:"Validation", v:"Tu connais tes trois programmes par cœur et tu sais lequel déclencher sans réfléchir."},
  {t:"src", v:["manuel"]}
]},

{id:"e3", title:"Survivre à un engagement",
 intro:"La leçon de synthèse : tout mettre ensemble sous pression. Détection, décision, manœuvre, leurres — dans cet ordre, en quelques secondes.",
 body:[
  {t:"h", v:"La séquence de survie"},
  {t:"proc", v:[
   "<b>Détecter</b> : l'alerte RWR ou le départ missile vu dehors. Chaque seconde d'avance compte double.",
   "<b>Annoncer et localiser</b> : d'où vient la menace ? Le RWR te donne l'azimut ; tes yeux confirment.",
   "<b>Manœuvrer</b> : virage franc pour mettre la menace sur le travers (radar) ou casser la ligne de vue (IR), en jouant l'altitude si le terrain le permet.",
   "<b>Leurrer</b> : le bon programme, pendant la manœuvre, pas après.",
   "<b>Réévaluer</b> : la menace a-t-elle décroché ? Sinon, on recommence. Si oui, on sort de la zone — on ne retourne pas voir."]},
  {t:"img", k:"caution", c:"Voyants d'alerte du pare-brise — après un engagement, un coup d'œil pour vérifier que l'avion n'a rien pris."},
  {t:"note", k:"", lbl:"Radar contre infrarouge", v:"Contre un missile radar, ta manœuvre vise à réduire ta vitesse relative vue du radar (le mettre sur le travers) pendant que les paillettes lui offrent une cible alternative. Contre un missile infrarouge, tout est dans la ligne de vue : fusées + changement de plan brutal pour sortir du champ du chercheur."},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Mission : traverser une zone défendue par un ou deux systèmes sol-air de menace moyenne, aller-retour.",
   "Premier passage haut et prudent : repère les menaces au RWR sans t'exposer.",
   "Deuxième passage dans l'enveloppe : laisse-toi engager volontairement et déroule la séquence complète.",
   "Répète jusqu'à sortir intact trois fois de suite.",
   "Note ce qui t'a surpris et le délai réel entre l'alerte et ta réaction."]},
  {t:"note", k:"go", lbl:"Validation", v:"Trois traversées de zone défendue, engagé à chaque fois, intact à chaque fois. Direction la section F : rendre les coups."},
  {t:"src", v:["manuel"]}
]},
{id:"e4", title:"Ressources vidéo",
 intro:"Pas encore de vidéo consacrée uniquement à l'ALE-47, mais le tutoriel DTC couvre la programmation des contre-mesures (CMDS) en pratique.",
 body:[
  {t:"video", id:"ZbV8J47WP1k", c:"Tomcat GAME CHANGER! DCS F-14B(U) Basic DTC Tutorial — la partie CMDS couvre la préparation des programmes de leurres avant vol."}
]}

]},

{id:"f1", title:"Ce qu'on emporte, et une étape à ne pas oublier",
 intro:"Avant de parler de largage, deux choses à connaître : ce que le B(U) peut emporter, et une étape de préparation invisible mais bloquante si on l'oublie.",
 body:[
  {t:"h", v:"Le loadout air-sol"},
  {t:"p", v:"Le B(U) emporte tout ce que les Tomcat précédents pouvaient déjà porter, plus trois armes guidées par GPS propres à cette version : le <b>GBU-31</b> (2000 livres, version pénétrante BLU-109 ou explosive BLU-117), le <b>GBU-38</b> (500 livres, BLU-111), et le <b>GBU-24E/B</b>, une bombe à double guidage GPS et laser."},
  {t:"img", k:"stores", c:"Vue d'ensemble des emports du B(U)."},
  {t:"h", v:"La bande magnétique air-sol"},
  {t:"p", v:"Le calculateur d'armement du Tomcat charge ses programmes depuis des bandes magnétiques. Le programme tactique principal est toujours actif, mais les programmes spéciaux — air-sol, TID AVIA, entraînement — doivent être chargés depuis la bande, et un seul peut être actif à la fois."},
  {t:"note", k:"warn", lbl:"À faire avant toute mission air-sol", v:"Charge le programme air-sol depuis le <b>menu du PTID</b>, dès le démarrage. <b>Sans ce chargement, le radar AWG-9 ne peut tout simplement pas fonctionner en télémétrie air-sol</b> — aucun mode air-sol assisté par radar ne sera disponible, quoi que tu fasses ensuite."},
  {t:"note", k:"", lbl:"Le mode qui contourne cette contrainte", v:"Une fois le programme air-sol chargé, sélectionner <b>MANUAL</b> sur l'ACP désactive juste la télémétrie air-sol du radar — le programme reste chargé, et l'AWG-9 redevient disponible pour tous ses modes air-air. C'est ce qui permet de rester vigilant au-dessus d'une cible sans perdre ta capacité de largage."},
  {t:"h", v:"Le panneau qui commande tout : l'ACP"},
  {t:"img", k:"acp", c:"Panneau d'armement (ACP), console verticale gauche"},
  {t:"tbl", head:["Réglage","Ce qu'il commande"], rows:[
   ["Sélection de station","Quelle(s) station(s) d'emport sont armées.","—rio"],
   ["Type d'arme","La famille d'arme employée — conditionne la symbologie du HUD.","—rio"],
   ["ATTK MODE","Le mode d'attaque : CMPTR TGT, CMPTR IP, CMPTR PLT ou MAN (voir leçon suivante).","—rio"],
   ["Fusée électrique","INST (instantanée), DLY 1 / DLY 2 (retard), VT (aérienne), SAFE.","—rio"],
   ["Fusée mécanique","Nose ou Nose-Tail.","—rio"],
   ["Mode de largage","Step ou Ripple, en Single ou Pairs.","—rio"],
   ["Intervalle de rafale","Espacement des largages en millisecondes, par pas de 10.","—rio"],
   ["Quantité","Nombre de bombes larguées à chaque commande de tir.","—rio"]]},
  {t:"note", k:"", lbl:"Le raccourci qui fait gagner du temps", v:"L'outil de bombardement intégré (<b>RCtrl+B</b>) permet au pilote de transmettre directement ces réglages à JESTER, sans passer par les menus. Pour le B(U), il inclut aussi un calculateur de largage manuel JDAM (portée maximale et temps de vol selon les paramètres de largage)."},
  {t:"p", v:"C'est le RIO qui règle presque tout depuis l'ACP : sélection de station, type d'arme, mode d'attaque, fusée. Le pilote hérite du résultat sur son HUD."},
  {t:"chk", v:"Tu sais où charger le programme air-sol et pourquoi MANUAL sur l'ACP ne le décharge pas."}
]},

{id:"f2", title:"Bombes lisses : les quatre modes d'attaque",
 intro:"Le sélecteur ATTK MODE du RIO propose quatre logiques différentes pour placer une bombe non guidée. Comprendre les quatre te permet de choisir la bonne plutôt que de toujours utiliser la même.",
 body:[
  {t:"h", v:"Les quatre modes"},
  {t:"tbl", head:["Mode","Nom complet","Principe"], rows:[
   ["CMPTR TGT","Computer Target","Mode semi-automatique guidé par calculateur, l'équivalent d'un CCRP moderne."],
   ["CMPTR IP","Computer Initial Point","Comme CMPTR TGT, mais référencé à un point initial connu plutôt qu'à la cible — utile quand la cible réelle est difficile à repérer visuellement mais se trouve près d'un repère identifiable."],
   ["CMPTR PLT","Computer Pilot","Mode manuel assisté : le calculateur affiche en continu le point d'impact au HUD, l'équivalent d'un CCIP moderne."],
   ["MAN","Manuel","Secours pur : un réticule fixe à une dépression réglée à l'avance, sans aucune assistance du calculateur."]]},

  {t:"h", v:"CMPTR PLT — le mode qu'on apprend en premier"},
  {t:"p", v:"C'est le plus direct : le calculateur affiche en temps réel, sous forme de réticule, où tomberait la bombe si tu larguais maintenant. Tu voles ce réticule sur la cible et tu presses la détente <span class='bindtag' data-bind-cmd='Store Release'></span>."},
  {t:"img", k:"stores", c:"Symbologie HUD en CMPTR PLT (repère générique)."},
  {t:"note", k:"", lbl:"Le losange qui prévient", v:"Si l'arme configurée est une roquette et qu'elle est hors de portée, un losange de désignation recouvre le réticule. Le losange disparaît une fois la cible à portée — c'est le signal pour tirer."},

  {t:"h", v:"MAN — le mode de secours"},
  {t:"p", v:"Fonctionne comme CMPTR PLT dans l'esprit — tu voles le réticule sur la cible — mais le réticule n'est <b>pas</b> mis à jour par le calculateur. Il reste fixe, à une dépression sous l'axe de l'avion que tu règles toi-même au panneau de correction de site, sur la base des tables de largage ou de ton estimation d'altitude, d'angle de piqué et de vitesse."},
  {t:"note", k:"warn", lbl:"Quand l'utiliser", v:"MAN est un mode de secours pur, à réserver à une panne du calculateur ou à une situation où tu ne veux aucune télémétrie radar. Sinon, préfère CMPTR PLT."},

  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Programme air-sol chargé, cible non défendue. Sélectionne CMPTR PLT à l'ACP <span class='bindtag unbound' title='Commande RIO, absente du profil pilote'>RIO</span>.",
   "Passe en piqué à 30° environ, amène le réticule sur la cible, largue, ressource franche.",
   "Cinq passes, en notant ton altitude de largage et ta hauteur de ressource au radioaltimètre.",
   "Une passe en MAN : règle une dépression au panneau de correction de site, et compare la précision au mode CMPTR PLT.",
   "Note tes réglages de passe qui fonctionnent."]},
  {t:"note", k:"go", lbl:"Validation", v:"Trois bombes sur cinq à moins de 50 m de la cible en CMPTR PLT."},
  {t:"src", v:["manuel"]}
]},

{id:"f3", title:"Bombes guidées laser et GBU-24E/B",
 intro:"Le LANTIRN désigne une cible au laser, ton RIO fait le plus gros du travail. Le B(U) ajoute une arme unique à cette famille : une bombe qui n'a même pas besoin du laser pour toucher.",
 body:[
  {t:"h", v:"Le principe du guidage laser"},
  {t:"p", v:"Le RIO pointe la nacelle LANTIRN, cherche, accroche et illumine la cible. La bombe suit le point laser réfléchi. Ta part : voler un profil stable qui garde la cible dans le champ de la nacelle jusqu'à l'impact."},
  {t:"img", k:"lgbcues", c:"Symbologie typique de largage LGB : temps avant largage, temps avant impact, distance oblique."},
  {t:"note", k:"warn", lbl:"Piège classique", v:"Illuminer trop tôt épuise l'énergie de la bombe avant l'impact. Manœuvrer fort juste après le largage peut masquer la ligne de vue de la nacelle vers la cible — dans les deux cas, la bombe rate."},

  {t:"h", v:"Le GBU-24E/B : une bombe à double guidage"},
  {t:"img", k:"gbu24", c:"GBU-24E/B — Paveway III amélioré, guidage GPS et laser combiné."},
  {t:"p", v:"C'est une arme <b>propre au B(U)</b> parmi les Tomcat. Elle combine un GPS et une centrale inertielle à gyrolaser au corps d'une GBU-24 Paveway III classique, en plus de son guidage laser existant."},
  {t:"note", k:"go", lbl:"Ce que le double guidage change concrètement", v:"Si aucune énergie laser n'est détectée, la bombe se dirige quand même vers son point d'impact préplanifié et explose comme prévu, grâce au GPS seul. La précision augmente si une désignation laser est fournie en plus. Elle peut même être larguée à travers une couche nuageuse épaisse, puis accrocher un laser au sol une fois la couche traversée."},
  {t:"p", v:"Conséquence pratique : le GBU-24E/B pardonne un manque de désignation là où une LGB classique rate complètement sans laser. Deux stations seulement — 3 et 5 — peuvent la porter, à cause de sa taille. Elle s'emploie aussi bien en cible d'opportunité qu'en mission préplanifiée, exactement comme la JDAM des deux leçons suivantes."},

  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Attaque complète à la LGB classique sur cible fixe, laisse JESTER gérer la nacelle.",
   "Deuxième attaque sur cible mobile.",
   "Si tu as un GBU-24E/B en soute : largue-le <span class='bindtag' data-bind-cmd='Store Release'></span> sans désignation laser et observe qu'il touche quand même son point préplanifié.",
   "Note ton enchaînement JESTER exact pour la désignation."]},
  {t:"note", k:"go", lbl:"Validation", v:"Deux cibles détruites en une passe chacune, dont une mobile."},
  {t:"src", v:["manuel"]}
]},

{id:"f4", title:"JDAM : mission préplanifiée",
 intro:"La JDAM est une arme GPS pure — aucun laser, aucun visuel requis. Premier des deux cas d'emploi que couvre le manuel : la mission préparée avant le vol.",
 body:[
  {t:"h", v:"Le principe"},
  {t:"p", v:"Coordonnées de cible et paramètres terminaux sont préparés dans l'éditeur de mission, puis transférés dans l'avion par la cartouche de données (MDL) au démarrage. Le calculateur peut stocker <b>jusqu'à huit missions préplanifiées par station</b>, chacune avec sa cible, sa zone de tir autorisée (LAR) et son point de largage."},
  {t:"img", k:"pplanner", c:"Planification d'une mission JDAM dans l'éditeur — coordonnées, cap d'attaque, altitude et vitesse de largage."},
  {t:"img", k:"plarplan", c:"Zone de tir autorisée (LAR) construite autour du point de largage."},
  {t:"note", k:"", lbl:"Ordre de largage par défaut", v:"Quand toutes les stations compatibles sont sélectionnées, la séquence de tir par défaut est <b>4 - 5 - 3 - 6</b>. En préparant plusieurs missions, place tes points de largage dans cet ordre."},

  {t:"h", v:"Les deux logiques de guidage"},
  {t:"p", v:"Le sélecteur de mode d'attaque de l'ACP change ce que ton HUD t'affiche."},
  {t:"tbl", head:["Sélection ACP","Guidage","Repères temporels HUD"], rows:[
   ["MANUAL — Target Steering","Vers la <b>cible</b>, référencé à la ligne de tir optimale (ROPT).","TMAX (portée maximale), TOPT (portée optimale), TMIN (portée minimale)."],
   ["CPTR PLT — Launch Point Steering","Vers le <b>point de largage préplanifié</b>, référencé à la zone de tir (LAR).","TMAX (limite de zone), TREL (point de largage), TMIN (portée minimale)."]]},
  {t:"img", k:"jdam_pp_plt_tmax", c:"HUD en Launch Point Steering — TMAX, avant d'entrer dans la zone de tir."},

  {t:"h", v:"La page JMSN du PTID"},
  {t:"p", v:"C'est ta page de vérification. Le RIO y relit et corrige les missions préplanifiées : coordonnées de cible, altitude, cap et vitesse d'impact souhaités."},
  {t:"tbl", head:["Élément","Fonction"], rows:[
   ["Station et arme sélectionnées","Quelle bombe, sur quelle station, et son état."],
   ["Coordonnées et altitude de la cible","Le point de référence — modifiable en vol depuis le CDNU."],
   ["Défilement des missions préplanifiées","Bascule entre les huit missions stockées pour cette station."],
   ["Bouton UPDATE","<b>À presser après tout chargement de cartouche ou toute modification de coordonnées</b> — sinon la bombe garde ses anciennes données.","—rio"],
   ["Alimentation JDAM","Encadrée une fois sous tension. Lance un compte à rebours de <b>8 minutes</b> qui disparaît en atteignant 5 — la bombe n'est prête qu'à ce moment."],
   ["Point de largage et altitude","Fixés à la planification, non modifiables en vol."]]},
  {t:"note", k:"warn", lbl:"Le réflexe à ne jamais sauter", v:"Après chargement de la cartouche de données <b>ou</b> toute modification de coordonnées en vol : presse <b>UPDATE</b>. C'est l'erreur la plus fréquente et la plus silencieuse — la bombe part avec les mauvaises données sans le moindre message d'erreur."},

  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Dans l'éditeur de mission, prépare une mission préplanifiée JDAM : cible, cap d'attaque, altitude et vitesse de largage.",
   "En vol, vérifie la page JMSN et presse UPDATE dès que la cartouche est chargée.",
   "Mets les JDAM sous tension tôt — anticipe les 8 minutes du compte à rebours.",
   "Vole la mission en Launch Point Steering (CPTR PLT) <span class='bindtag unbound' title='Commande RIO, absente du profil pilote'>RIO</span>, guidé par TMAX / TREL / TMIN.",
   "Recommence en Target Steering (MANUAL) et compare les deux modes de guidage.",
   "Note ta procédure complète : c'est la plus longue du tutoriel."]},
  {t:"note", k:"go", lbl:"Validation", v:"Une mission préplanifiée larguée avec succès, dans les deux modes de guidage."},
  {t:"src", v:["manuel"]}
]},

{id:"f5", title:"JDAM : cible d'opportunité",
 intro:"Contrairement aux chasseurs modernes, le B(U) n'a pas de mode dédié pour une cible non planifiée. La solution : détourner une mission préplanifiée existante en lui donnant de nouvelles coordonnées en vol. Voici la procédure complète du manuel, étape par étape.",
 body:[
  {t:"h", v:"Pourquoi cette méthode et pas une autre"},
  {t:"p", v:"L'emploi sur cible d'opportunité reste possible, mais il passe par une reprogrammation : n'importe quel point du plan de vol stocké dans le CDNU peut voir ses coordonnées copiées vers la page JMSN. C'est le détour que le manuel documente."},

  {t:"h", v:"La procédure complète"},
  {t:"proc", v:[
   "Sélectionne <b>A/G</b> sur le PDCP <span class='bindtag' data-bind-cmd='Display mode air to ground'></span>.",
   "Accroche le mode A/G sur le menu complet du PTID — JESTER le fait automatiquement si tu le lui demandes.",
   "Configure l'ACP normalement : station, fusée, type d'arme.",
   "Sélectionne <b>MANUAL</b> dans les options d'attaque de l'ACP <span class='bindtag unbound' title='Commande RIO, absente du profil pilote'>RIO</span> — le pilote reçoit alors les temporisations TMAX / TOPT / TMIN.",
   "Désigne la cible avec le LANTIRN.",
   "Maintiens le bouton S-7 (FOV) du LANTIRN <span class='bindtag unbound' title='Commande RIO, absente du profil pilote'>RIO</span> pendant 2 secondes : un nouveau waypoint (numéro 51 ou suivant) se crée dans le plan de vol.",
   "Sélectionne ce nouveau waypoint sur le CDNU.",
   "Fais défiler horizontalement jusqu'à la page d'édition de waypoint 2/2.",
   "Ouvre la page JMSN depuis la page tactique du PTID.",
   "Choisis la station et la mission préplanifiée que tu veux réutiliser pour cette cible.",
   "Vérifie l'altitude et les coordonnées sur le CDNU, puis presse la <b>LSK 7</b> <span class='bindtag unbound' title='Commande RIO, absente du profil pilote'>RIO</span> pour transférer les coordonnées vers la page JMSN.",
   "Presse <b>UPDATE</b> <span class='bindtag unbound' title='Commande RIO, absente du profil pilote'>RIO</span> sur la page JMSN pour mettre à jour la bombe.",
   "Sélectionne le guidage vers la cible : PB9 sur le PTID, ou la touche F4 (BDHI) du CDNU <span class='bindtag unbound' title='Commande RIO, absente du profil pilote'>RIO</span>."]},

  {t:"img", k:"ggwcues", c:"Repères HUD typiques pour une cible d'opportunité sans point de largage préplanifié."},
  {t:"note", k:"", lbl:"Un détail qui a son importance", v:"Le transfert de coordonnées via la LSK 7 du CDNU envoie toujours les données vers la mission préplanifiée <b>actuellement sélectionnée</b> pour la station choisie sur le CDNU. Ouvre la page JMSN et confirme la bonne mission <b>avant</b> de lancer le transfert, pas après."},

  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Vole une mission avec une cible non planifiée à l'avance.",
   "Déroule les treize étapes ci-dessus dans l'ordre, sans regarder tes notes la deuxième fois.",
   "Largue <span class='bindtag' data-bind-cmd='Store Release'></span> et vérifie l'impact.",
   "Note la séquence dans tes mots — c'est la procédure la plus dense du module, elle mérite ses propres mots."]},
  {t:"note", k:"warn", lbl:"Pièges", v:"Une erreur d'un chiffre dans les coordonnées : un kilomètre d'écart. Oublier UPDATE : la bombe garde les anciennes données. Larguer hors zone de tir autorisée : la bombe tombe court, proprement, inutilement."},
  {t:"note", k:"go", lbl:"Validation", v:"Tu désignes une cible non planifiée avec le LANTIRN et tu la détruis à la JDAM, sans relire la procédure. Le B(U) n'a plus de secret offensif pour toi."},
  {t:"src", v:["manuel"]}
]},
{id:"f6", title:"Ressources vidéo",
 intro:"La JDAM est le système le mieux documenté en vidéo, et pour cause : Heatblur met lui-même en avant ce tutoriel de Baltic Dragon, qui a participé à la conception des missions d'entraînement du module.",
 body:[
  {t:"video", id:"ESqfmpumaTw", c:"DCS: F14B(U) JDAM training: pre-planned mode — par Baltic Dragon, mis en avant par Heatblur lui-même comme référence pour l'emploi JDAM."},
  {t:"video", id:"ZbV8J47WP1k", c:"Tomcat GAME CHANGER! DCS F-14B(U) Basic DTC Tutorial — couvre aussi la préparation JDAM préplanifiée via le DTC."},
  {t:"vidlink", url:"https://f14.manuals.heatblur.se/f14bu/weapons/air_to_ground/gps_guided_weapons/ggw_employment.html", c:"Chapitre emploi GGW/JDAM du manuel en ligne Heatblur", src:"Référence texte officielle, la plus précise disponible"}
]}

]},

{id:"g1", title:"Urgences",
 intro:"Un avion endommagé qui rentre vaut mieux qu'un avion perdu — et savoir quand s'éjecter fait partie du métier. On ne mémorise pas tout : on mémorise les réflexes immédiats, le reste se lit sur la checklist.",
 body:[
  {t:"note", k:"go", lbl:"Version pas à pas", v:"Cette leçon explique le <b>raisonnement</b> derrière chaque panne. Pour la checklist courte à garder en tête pendant que tu voles (carburant, moteur, hydraulique, incendie), va sur <a href='carburant-pannes-retour.html' style='color:var(--amber)'>Carburant, pannes et retour, pas à pas</a>."},
  {t:"h", v:"La règle des trois temps"},
  {t:"p", v:"Toute urgence se traite en trois temps : <b>piloter</b> d'abord (l'avion vole encore, garde-le en vol), <b>identifier</b> ensuite (quel voyant, quel paramètre, quel moteur), <b>agir</b> enfin (les réflexes immédiats, puis la checklist). L'erreur classique est d'inverser : se jeter sur les interrupteurs pendant que l'avion part en vrille."},
  {t:"img", k:"caution", c:"Voyants du montant de pare-brise gauche"},
  {t:"tbl", head:["Voyant","Signification"], rows:[
   ["WHEELS","Clignote si le train n'est pas sorti et verrouillé, volets sous 10° et une manette sous 85 %."],
   ["BRAKES","Panne d'anti-dérapage ou de freins. S'allume aussi si le frein de parking est serré."],
   ["ACLS/AP","L'appontage automatique ou le pilote automatique est déconnecté."],
   ["NWS ENGA","Direction de roue avant engagée."],
   ["AUTO THROT","La régulation automatique de vitesse s'est déconnectée."]]},
  {t:"p", v:"Le tableau complet des voyants d'alerte de la console droite est traité en section Cockpit."},
  {t:"h", v:"Panne moteur"},
  {t:"p", v:"Le Tomcat vole très bien sur un moteur — le vrai danger est ailleurs : les moteurs sont très écartés, donc une poussée asymétrique à basse vitesse et forte incidence peut te mettre en lacet violent, jusqu'au départ. Réflexes : réduire l'incidence, compenser au palonnier, sécuriser le moteur mort (manette coupée, carburant fermé), et gérer le vol comme un avion en énergie limitée."},
  {t:"img", k:"lengine", c:"Paramètres moteur — identifie le moteur en cause avant de couper quoi que ce soit."},
  {t:"img", k:"oil", c:"Pressions d'huile — une chute lente ici annonce souvent la panne avant le voyant."},
  {t:"h", v:"Hydraulique, incendie, carburant"},
  {t:"table", head:["Panne","Le réflexe"], rows:[
   ["Incendie moteur","Manette du moteur coupée, carburant fermé, agent extincteur. Ne pas rallumer un moteur qui a brûlé."],
   ["Perte hydraulique","Surveiller l'autre circuit ; anticiper des commandes dégradées et un train à sortir en secours."],
   ["Fuite carburant","Calcul immédiat : autonomie restante contre distance du terrain le plus proche. La réponse décide du déroutement."]]},
  {t:"img", k:"hyd", c:"Pression hydraulique — deux circuits, tant qu'il en reste un, l'avion se pilote."},
  {t:"img", k:"fuel", c:"Panneau de gestion carburant"},
  {t:"tbl", head:["N°","Commande","Fonction"], rows:[
   ["1","QTY SEL","Choisit les réservoirs affichés : FEED (nourrices et fuselage), WING (voilure), EXT (bidons)."],
   ["2","FEED","Routage du carburant vers les moteurs. Verrouillé sur NORM."],
   ["3","WING/EXT TRANS","ORIDE force le transfert, AUTO est le mode normal, OFF le coupe."],
   ["4","Voyant perche","S'allume quand la perche n'est ni sortie ni rentrée complètement."],
   ["5","DUMP","Vidange carburant, aérofreins rentrés et sans postcombustion.","Fueldump Dump"],
   ["6","REFUEL PROBE","ALL EXTD, FUS EXTD ou RET.","Refuel Probe extend & Refuel All, else Retract Probe"],
   ["7","ANTI SKID / SPOILER BK","BOTH, OFF ou SPOILER BK.","Antiskid & Spoiler BK - Both"],
   ["8","MASTER RESET","Réarme la détection de panne du CADC.","—click"],
   ["9","Position des gouvernes","Indicateur spoilers, dérives, empennages."]]},
  {t:"h", v:"L'éjection"},
  {t:"p", v:"La décision se prend avant d'en avoir besoin : fixe-toi des seuils à froid (par exemple : avion incontrôlable sous une certaine altitude = éjection immédiate, sans débat). Rappelle-toi que tu commandes un équipage : l'éjection concerne les deux sièges."},
  {t:"img", k:"canopy", c:"Largage de verrière — connaître son emplacement avant d'en avoir besoin."},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Mission d'entraînement avec pannes scriptées, ou pannes aléatoires activées.",
   "Panne moteur en croisière : sécurise, déroute, pose sur un moteur.",
   "Panne moteur au décollage — le cas le plus dangereux : décide vite entre continuer et s'arrêter.",
   "Fuite carburant en mission : fais le calcul de déroutement en vol, réellement.",
   "Note tes seuils d'éjection personnels et tes réflexes par panne."]},
  {t:"note", k:"warn", lbl:"Piège", v:"S'acharner à ramener un avion condamné. Un déroutement raté par orgueil coûte l'équipage entier."},
  {t:"note", k:"go", lbl:"Validation", v:"Tu poses l'avion avec un moteur en panne, terrain puis bateau si tu te sens prêt."},

const KEY="f14bu-cursus";
let st={done:{},notes:{}}, sIdx=0, lIdx=0;
async function load(){ const r=await __sget(KEY); if(r&&r.value){ try{st=Object.assign(st,JSON.parse(r.value));}catch(e){} } }
let tm=null;
function save(){ clearTimeout(tm); tm=setTimeout(()=>__sset(KEY,JSON.stringify(st)),400); }

function fig(k,c){
  const SEC=SECTIONS[sIdx], v=SEC.IMG[k]; let fn,id;
  if(Array.isArray(v)){fn=v[0];id=v[1];} else {id=v;fn=FN[id]||id;}
  return `<figure><img src="${LOCAL}${fn}" alt="${c}" loading="lazy"
      onerror="if(!this.dataset.f){this.dataset.f=1;this.src='${D(id)}';}else{this.closest('figure').classList.add('failed');}"
      onclick="openLb(this.src)">
    <div class="imgfail">Image non chargée — ouvre-la dans Drive via le lien ci-dessous.</div>
    <figcaption><span>${c}</span><a href="${V(id)}" target="_blank" rel="noopener">Drive ↗</a></figcaption></figure>`;
}
function table(h,rows){
  return `<table class="keytbl"><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function bindCell(cmd){
  if(cmd===undefined) return '<td></td>';
  if(cmd==='—rio') return '<td><span class="bindtag unbound" title="Commande RIO, absente du profil pilote">RIO</span></td>';
  if(cmd==='—click') return '<td><span class="bindtag unbound" title="Pas de bind HOTAS : action à la souris/VR dans le cockpit">Clic cockpit</span></td>';
  return `<td><span class="bindtag" data-bind-cmd="${cmd}"></span></td>`;
}
function tbl(h,rows){
  const nCols = h.length;
  const hasBind = rows.some(r=>r.length>nCols);
  const head = hasBind ? [...h,'HOTAS'] : h;
  return `<table><thead><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r=>`<tr>${r.slice(0,nCols).map((c,i)=>i===0&&/^\d+$/.test(c)?`<td class="n">${c}</td>`:(i===1?`<td class="nm">${c}</td>`:`<td>${c}</td>`)).join("")}${hasBind?bindCell(r[nCols]):''}</tr>`).join("")}</tbody></table>`;
}
function block(b){
  if(b.t==="tbl") return tbl(b.head,b.rows);
  if(b.t==="video"){
    return `<figure class="vid"><iframe src="https://www.youtube.com/embed/${b.id}" title="${b.c}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe>
      <figcaption><span>${b.c}</span><a href="https://www.youtube.com/watch?v=${b.id}" target="_blank" rel="noopener">YouTube ↗</a></figcaption></figure>`;
  }
  if(b.t==="vidlink"){
    return `<a class="vidlink" href="${b.url}" target="_blank" rel="noopener"><span class="ic">▶</span><span class="tx"><span class="tt">${b.c}</span><span class="src">${b.src||""}</span></span></a>`;
  }
  if(b.t==="h")   return `<h3>${b.v}${b.badge?'<span class="badge" style="margin-left:8px;vertical-align:0">Nouveau</span>':''}</h3>`;
  if(b.t==="p")   return `<p>${b.v}</p>`;
  if(b.t==="img") return fig(b.k,b.c);
  if(b.t==="proc")return `<ol class="proc">${b.v.map(s=>`<li><span>${s}</span></li>`).join("")}</ol>`;
  if(b.t==="table")return table(b.head,b.rows);
  if(b.t==="pat") return `<div class="pat">${b.v}<div class="cap">${b.cap}</div></div>`;
  if(b.t==="note")return `<div class="note ${b.k||""}"><span class="lbl">${b.lbl}</span><p>${b.v}</p></div>`;
  if(b.t==="src"){
    const SEC=SECTIONS[sIdx];
    return `<h3>Sources dans ton Drive</h3><div class="srcs">${
      b.v.map(k=>`<a href="${V(SEC.DOC[k][1])}" target="_blank" rel="noopener">${SEC.DOC[k][0]} ↗</a>`).join("")}</div>`;
  }
  return "";
}
function totals(){
  let t=0,d=0;
  SECTIONS.forEach(S=>S.L.forEach(l=>{t++; if(st.done[l.id])d++;}));
  return [d,t];
}
function render(){
  const SEC=SECTIONS[sIdx], l=SEC.L[lIdx];
  const last = sIdx===SECTIONS.length-1 && lIdx===SEC.L.length-1;
  const first = sIdx===0 && lIdx===0;
  document.getElementById("main").innerHTML=`<div class="page">
    <div class="eyebrow">Section ${SEC.letter} · ${SEC.title} · leçon ${lIdx+1} sur ${SEC.L.length}</div>
    <h2>${l.title}${l.isNew?'<span class="badge">Nouveau sur le B(U)</span>':""}</h2>
    <p class="intro">${l.intro}</p>
    ${l.body.map(block).join("")}
    <h3>Tes notes de vol</h3>
    <textarea id="nt" placeholder="Procédures exactes, réglages, ce qui a coincé…">${(st.notes[l.id]||"").replace(/</g,"&lt;")}</textarea>
    <button class="doneline${st.done[l.id]?" on":""}" id="dn"><span class="box"></span>
      <span>${st.done[l.id]?"Leçon validée":"Marquer cette leçon comme validée"}</span></button>
    <div class="nav">
      <button class="ghost" id="pv"${first?" disabled style=opacity:.3":""}>← Précédent</button>
      <button class="ghost" id="nx"${last?" disabled style=opacity:.3":""}>Suivant →</button>
    </div></div>`;
  document.getElementById("nt").oninput=e=>{st.notes[l.id]=e.target.value;save();};
  document.getElementById("dn").onclick=()=>{st.done[l.id]=!st.done[l.id];save();render();};
  if(!first) document.getElementById("pv").onclick=()=>{ if(lIdx>0)lIdx--; else {sIdx--;lIdx=SECTIONS[sIdx].L.length-1;} render(); window.scrollTo(0,0); };
  if(!last)  document.getElementById("nx").onclick=()=>{ if(lIdx<SEC.L.length-1)lIdx++; else {sIdx++;lIdx=0;} render(); window.scrollTo(0,0); };
  rail();
  paintBindBadges();
}
function rail(){
  const r=document.getElementById("rail"); r.innerHTML="";
  SECTIONS.forEach((S,i)=>{
    const h=document.createElement("div");
    h.className="phase-hd"; h.innerHTML=`<span>${S.letter} · ${S.title}</span><span class="rule"></span>`;
    r.appendChild(h);
    S.L.forEach((l,j)=>{
      const b=document.createElement("button");
      b.className="item"+(i===sIdx&&j===lIdx?" on":"")+(st.done[l.id]?" done":"");
      b.innerHTML=`<span class="idx">${st.done[l.id]?"✓":String(j+1).padStart(2,"0")}</span><span class="nm">${l.title}</span>`;
      b.onclick=()=>{sIdx=i;lIdx=j;render();window.scrollTo(0,0);};
      r.appendChild(b);
    });
  });
  const [d,t]=totals(), pc=t?Math.round(d/t*100):0;
  document.getElementById("gfill").style.width=pc+"%";
  document.getElementById("gpct").textContent=pc+" %";
  document.getElementById("gcnt").textContent=`${d} / ${t} leçons`;
  document.getElementById("foot").textContent=`Section en cours : ${SECTIONS[sIdx].letter} — ${SECTIONS[sIdx].title}`;
}
/* ---------- badges de bind dynamiques ----------
   Lit data/f14bu-bindings.json, corrigé par le localStorage qu'écrit déjà
   export-bindings.html : si l'utilisateur y change un bind, le badge le
   reflète dès la prochaine visite de cette page — ou en direct si les deux
   pages sont ouvertes ensemble, via l'événement storage. */
const BIND_STORE_KEY = 'f14bu-export-bindings-v1';
const AXIS_KEYS = {X:'JOY_X', Y:'JOY_Y', Z:'JOY_Z', RX:'JOY_RX', RY:'JOY_RY', RZ:'JOY_RZ'};
const DEV_LABEL = {stick:'Manche', throttle:'Manette', pto2:'PTO2', pedals:'Pédales'};
let BINDINGS = null;
async function loadBindings(){
  try { BINDINGS = await fetch('data/f14bu-bindings.json').then(r=>r.json()); }
  catch(e){ BINDINGS = null; }
}
function deriveKeys(n, count){
  const upper = String(n).toUpperCase(), slots = Math.max(count,1);
  if (AXIS_KEYS[upper]) return new Array(slots).fill(AXIS_KEYS[upper]);
  if (upper === 'SLDR')  return new Array(slots).fill('JOY_SLIDER1');
  if (/^\d+$/.test(n))   return new Array(slots).fill('JOY_BTN'+n);
  const range = n.match(/^(\d+)-(\d+)$/);
  if (range){
    const first=+range[1], last=+range[2], keys=[];
    for(let b=first; b<=last && keys.length<slots; b++) keys.push('JOY_BTN'+b);
    return keys;
  }
  return new Array(slots).fill('');
}
function bindingsFor(cmdName){
  if(!BINDINGS) return [];
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem(BIND_STORE_KEY)||'null'); }catch(e){}
  const overrides = (saved&&saved.state)||{};
  const hits=[];
  for(const b of BINDINGS.bindings){
    const entry = overrides[b.device+'|'+b.n];
    const commands = (entry&&Array.isArray(entry.commands)) ? entry.commands : b.commands;
    const keys = (entry&&Array.isArray(entry.keys)) ? entry.keys : deriveKeys(b.n, commands.length);
    commands.forEach((name,i)=>{ if(name===cmdName && keys[i]) hits.push({device:b.device, key:keys[i]}); });
  }
  return hits;
}
function paintBindBadges(){
  document.querySelectorAll('[data-bind-cmd]').forEach(el=>{
    const hits = bindingsFor(el.dataset.bindCmd);
    el.textContent = hits.length
      ? hits.map(h=>`${DEV_LABEL[h.device]||h.device} · ${h.key.replace('JOY_','')}`).join(' · ')
      : 'non affecté';
    el.classList.toggle('unbound', hits.length===0);
  });
}
addEventListener('storage', e=>{ if(!e.key || e.key===BIND_STORE_KEY) paintBindBadges(); });

function openLb(src){document.getElementById("lbimg").src=src;document.getElementById("lb").classList.add("on");}
document.getElementById("lb").onclick=()=>document.getElementById("lb").classList.remove("on");
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") document.getElementById("lb").classList.remove("on");
  if(e.target.matches("textarea")) return;
  const SEC=SECTIONS[sIdx];
  if(e.key==="ArrowRight"&&!(sIdx===SECTIONS.length-1&&lIdx===SEC.L.length-1)){ if(lIdx<SEC.L.length-1)lIdx++; else {sIdx++;lIdx=0;} render(); }
  if(e.key==="ArrowLeft"&&!(sIdx===0&&lIdx===0)){ if(lIdx>0)lIdx--; else {sIdx--;lIdx=SECTIONS[sIdx].L.length-1;} render(); }
});
Promise.all([load(), loadBindings()]).then(render);
</script>
