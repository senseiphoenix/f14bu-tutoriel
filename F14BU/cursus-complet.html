<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursus F-14B(U) — appli complète</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--deck:#10161a;--panel:#18222a;--panel-2:#1e2a33;--line:#2c3b45;--ink:#e6e9e4;--dim:#8b9aa3;--amber:#f2a93b;--go:#6fd08c;--warn:#d9695a;
    --display:"Oswald",sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--deck);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  a{color:var(--amber)}
  .shell{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
  @media(max-width:900px){.shell{grid-template-columns:1fr}}
  .rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .rail-head{padding:20px;border-bottom:1px solid var(--line)}
.rail-head a{display:inline-flex;align-items:center;min-height:28px}
  .tail{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--amber);text-transform:uppercase}
  h1{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:.05em;line-height:1.05;margin:8px 0 6px;text-transform:uppercase}
  .sub{font-size:12.5px;color:var(--dim);margin:0}
  .rail-list{overflow-y:auto;flex:1;padding:8px 0 20px}
  .item{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:10px 20px;border-left:2px solid transparent}
  .item:hover{background:var(--panel-2)}
  .item.on{background:var(--panel-2);border-left-color:var(--amber)}
  .item .idx{font-family:var(--mono);font-size:11px;color:var(--dim);padding-top:3px}
  .item .nm{flex:1;font-size:14px}
  .item.done .nm{color:var(--dim)} .item.done .idx{color:var(--go)}
  .rail-foot{border-top:1px solid var(--line);padding:12px 20px;font-size:12px;color:var(--dim)}
  .page{padding:34px 44px 90px;max-width:900px}
  @media(max-width:700px){.page{padding:22px 18px 70px}}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  h2{font-family:var(--display);font-weight:600;font-size:33px;letter-spacing:.03em;line-height:1.1;margin:6px 0 0;text-transform:uppercase}
  .badge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--deck);background:var(--amber);padding:3px 7px;vertical-align:6px;margin-left:10px}
  .intro{font-size:16px;margin:18px 0 0;border-left:2px solid var(--amber);padding-left:16px}

  table{width:100%;border-collapse:collapse;margin:14px 0 0;font-size:14px}
  th,td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
  th{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);background:var(--panel)}
  td.n{font-family:var(--mono);color:var(--amber);text-align:center;width:44px;font-weight:600}
  td.nm{font-weight:600}
  tbody tr:nth-child(odd){background:rgba(30,42,51,.35)}
  .bindtag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--go);background:rgba(111,208,140,.12);border:1px solid rgba(111,208,140,.4);border-radius:3px;padding:1px 6px;white-space:nowrap}
  .bindtag.unbound{color:var(--dim);background:rgba(139,154,163,.08);border-color:var(--line)}
  h3{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:38px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  p{margin:14px 0}
  figure{margin:20px 0;border:1px solid var(--line);background:#0b1114;padding:10px}
  figure img{width:100%;display:block;cursor:zoom-in;min-height:40px}
  figcaption{font-size:12.5px;color:var(--dim);margin-top:9px;display:flex;justify-content:space-between;gap:14px}
  figcaption a{font-family:var(--mono);font-size:11px;white-space:nowrap;display:inline-flex;align-items:center;min-height:24px;padding:0 5px}
  .imgfail{display:none;padding:22px 14px;font-size:13px;color:var(--dim);text-align:center}
  figure.failed img{display:none} figure.failed .imgfail{display:block}
  ol.proc{list-style:none;counter-reset:s;padding:0;margin:16px 0}
  ol.proc li{counter-increment:s;display:flex;gap:14px;padding:10px 0;border-bottom:1px solid rgba(44,59,69,.5)}
  ol.proc li::before{content:counter(s,decimal-leading-zero);font-family:var(--mono);font-size:11px;color:var(--amber);padding-top:4px;min-width:22px}
  ol.proc b{color:var(--ink)}
  code{font-family:var(--mono);font-size:.92em;background:var(--panel-2);padding:2px 6px;border:1px solid var(--line);color:var(--amber)}
  .note{border:1px solid var(--line);background:var(--panel);padding:14px 16px;margin:18px 0}
  .note .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);display:block;margin-bottom:5px}
  .note.warn .lbl{color:var(--warn)} .note.go .lbl{color:var(--go)}
  .note p{margin:0}
  .keytbl{width:100%;border-collapse:collapse;margin:16px 0;font-size:13.5px}
  .keytbl th,.keytbl td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
  .keytbl th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);background:var(--panel)}
  .keytbl td:first-child{font-family:var(--mono);white-space:nowrap}
  .srcs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .srcs a{font-family:var(--mono);font-size:11px;border:1px solid var(--line);padding:7px 11px;text-decoration:none;color:var(--dim)}
  .srcs a:hover{color:var(--amber);border-color:var(--amber)}
  textarea{width:100%;min-height:130px;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:13px 15px;resize:vertical;font:inherit;line-height:1.6}
  textarea:focus{outline:none;border-color:var(--amber)}
  .doneline{display:flex;align-items:center;gap:12px;margin-top:26px;border:1px solid var(--line);padding:14px 16px;background:var(--panel)}
  .doneline .box{width:18px;height:18px;border:1px solid var(--line);position:relative;flex:none}
  .doneline.on .box{background:var(--go);border-color:var(--go)}
  .doneline.on .box::after{content:"";position:absolute;left:6px;top:2px;width:4px;height:10px;border:solid var(--deck);border-width:0 2px 2px 0;transform:rotate(42deg)}
  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:34px;border-top:1px solid var(--line);padding-top:18px}
  .ghost{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);padding:8px 12px}
  .ghost:hover{color:var(--ink);border-color:var(--amber)}
  .lb{position:fixed;inset:0;background:rgba(5,8,10,.94);display:none;align-items:center;justify-content:center;padding:24px;z-index:20;cursor:zoom-out}
  .lb.on{display:flex} .lb img{max-width:100%;max-height:100%}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style>
<style>
.phase-hd{display:flex;align-items:baseline;gap:8px;padding:18px 20px 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
.phase-hd .rule{flex:1;height:1px;background:var(--line)}
.gauge-bar{height:6px;background:var(--panel-2);border:1px solid var(--line);position:relative;overflow:hidden;margin-top:14px}
.gauge-fill{position:absolute;inset:0 auto 0 0;background:var(--go);width:0;transition:width .35s}
.gauge-txt{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px}
.pat{border:1px solid var(--line);background:#0b1114;padding:16px;margin:20px 0}
.pat svg{width:100%;height:auto;display:block}
.pat .cap{font-size:12.5px;color:var(--dim);margin-top:10px}

  .vid{margin:20px 0;border:1px solid var(--line);background:#0b1114;padding:10px}
  .vid iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
  .vid figcaption{font-size:12.5px;color:var(--dim);margin-top:9px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .vid figcaption a{font-family:var(--mono);font-size:11px;white-space:nowrap;display:inline-flex;align-items:center;min-height:24px;padding:0 5px}
  .vidlink{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--panel);padding:13px 16px;margin:14px 0;text-decoration:none;color:var(--ink)}
  .vidlink:hover{border-color:var(--amber)}
  .vidlink .ic{font-family:var(--mono);color:var(--amber);font-size:18px}
  .vidlink .tx{flex:1}
  .vidlink .tt{font-weight:600;font-size:14px}
  .vidlink .src{font-size:12px;color:var(--dim);margin-top:2px}
</style>
</head><body>
<div class="shell">
  <aside class="rail">
    <div class="rail-head">
      <div class="tail">DCS · F-14B(U) Tomcat</div>
      <h1>Cursus<br>complet</h1>
      <p class="sub">32 leçons, 7 sections, une seule progression.</p>
      <div class="gauge-bar"><div class="gauge-fill" id="gfill"></div></div>
      <div class="gauge-txt"><span id="gpct">0 %</span><span id="gcnt"></span></div>
    </div>
    <nav class="rail-list" id="rail"></nav>
    <div class="rail-foot" id="foot"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="lb" id="lb"><img id="lbimg" alt=""></div>

async function __sget(k){ try{ if(window.storage){const r=await window.storage.get(k); if(r) return r;} }catch(e){}
  try{const v=localStorage.getItem(k); return v?{value:v}:null;}catch(e){return null;} }
async function __sset(k,v){ try{ if(window.storage){await window.storage.set(k,v); return;} }catch(e){}
  try{localStorage.setItem(k,v);}catch(e){} }

   "Une fois décidé, ajouter la 4ᵉ colonne de badge comme pour le reste du cursus."]}
]}
]},

{id:"a1", title:"Tour du cockpit",
 intro:"Avant de toucher quoi que ce soit, il faut savoir où sont les choses. Chaque planche ci-dessous porte des numéros ; le tableau qui la suit te dit ce que chacun désigne.",
 body:[
  {t:"h", v:"Les douze zones du poste pilote"},
  {t:"img", k:"pilot", c:"Poste pilote du F-14B(U)"},
  {t:"tbl", head:["N°","Zone","Ce qu'on y trouve"], rows:[
   ["1","Console latérale gauche","Manettes, DFCS, TACAN, radio UHF 1, interphone"],
   ["2","Console verticale gauche","Train, carburant, anti-dérapage, frein de parking"],
   ["3","Panneau genou gauche","Pressions huile et hydraulique, tuyère"],
   ["4","Planche de bord gauche","Badin, altimètres, variomètre, incidence"],
   ["5","Montant de pare-brise gauche","Voyants d'alerte"],
   ["6","Panneau central","HUD, VDI, panneau ACM, HSD, manche"],
   ["7","Montant de pare-brise droit","Voyants de menace, compas de secours"],
   ["8","Planche de bord droite","Moteurs, balayage des ailes, RWR, BDHI"],
   ["9","Panneau genou droit","Carburant, accéléromètre, montre"],
   ["10","Console verticale droite","Crosse, PDCP, correction canon"],
   ["11","Console latérale droite","Électricité, éclairage, air, tests"],
   ["12","Poignée de verrière","Ouverture et verrouillage"]]},
  {t:"note", k:"", lbl:"Ce que tu touches vraiment", v:"Quatre zones concentrent 90 % de tes actions : la <b>console gauche</b> (1), la <b>console verticale gauche</b> (2), la <b>planche de bord gauche</b> (4) et le <b>panneau central</b> (6)."},

  {t:"h", v:"Console latérale gauche"},
  {t:"img", k:"lconsole", c:"Console latérale gauche du pilote"},
  {t:"tbl", head:["N°","Nom","Fonction"], rows:[
   ["1","Bouton G-valve","Teste le gonflage de la combinaison anti-g."],
   ["2","Oxygène / ventilation","Débit d'oxygène au masque et ventilation de la combinaison."],
   ["3","Volumes / commande TACAN","Volumes audio du casque et attribution du TACAN entre pilote et RIO."],
   ["4","Panneau TACAN","Canal et mode TACAN."],
   ["5","Panneau ICS","Interphone de bord avec le RIO."],
   ["6","Panneau DFCS","Commandes de vol numériques et pilote automatique."],
   ["7","Radio UHF 1 (AN/ARC-159)","Radio du pilote, dite « AUX », pour les communications en patrouille."],
   ["8","Limiteur ASYM / mode moteur","Limiteur de poussée asymétrique en postcombustion, mode de régulation moteur."],
   ["9","Sélecteur de désignation","Désigne les cibles sol au HUD, parcourt les pistes TWS, commande les modes radar ACM."],
   ["10","Rampes d'air / manettes","Mode manettes, rampes d'entrée d'air, lancement moteur, trim de direction."],
   ["11","Manettes des gaz","Poussée et commandes HOTAS."]]},

  {t:"h", v:"Le CDNU — clavier de navigation"},
  {t:"img", k:"cdnu", c:"CDNU, sur la console gauche du RIO"},
  {t:"tbl", head:["N°","Élément","Fonction"], rows:[
   ["1","Touches LSK","Huit touches de sélection de ligne, numérotées 1 à 8 de gauche à droite. Elles lancent une fonction, déposent la donnée du scratchpad, changent de mode ou ouvrent la page indiquée."],
   ["2","BRT","Luminosité de l'écran."],
   ["3","ON / OFF","Alimentation du CDNU."],
   ["4","Scratchpad","Ligne du bas, entre crochets : affiche ce que tu tapes au clavier avant de le déposer."],
   ["5","Touches de fonction","F1 à F7 — fonctions liées à l'avion, accessibles sans passer par une page. La touche MENU affiche la liste."],
   ["6","Clavier alphanumérique","Chiffres et lettres. Les touches N, S, E et W sont mises en évidence pour la saisie de coordonnées."],
   ["7","Touches fléchées","Défilement vertical et horizontal des pages."],
   ["8","Touches dédiées","FPLN (plan de vol), PROG (progression), DIR (direct), RNAV, MARK."]]},

  {t:"h", v:"Planche de bord gauche"},
  {t:"img", k:"lpanel", c:"Planche de bord gauche"},
  {t:"tbl", head:["N°","Instrument","Fonction"], rows:[
   ["1","Radioaltimètre","Hauteur réelle au-dessus du sol, avec alerte de plancher."],
   ["2","Altimètre servopneumatique","Altitude barométrique, avec mode de secours."],
   ["3","Badin / machmètre","Vitesse indiquée et nombre de Mach."],
   ["4","Variomètre","Vitesse verticale en milliers de pieds par minute."],
   ["5","Coupe-feu moteur gauche","Coupe l'alimentation carburant du moteur gauche."],
   ["6","Indicateur d'incidence","Incidence, échelle de 0 à 30 unités."],
   ["7","Checklist atterrissage","Les points critiques avant de se poser."]]},

  {t:"h", v:"Le PTID — écran tactique"},
  {t:"img", k:"ptidpanel", c:"PTID et sa console, avec le sélecteur NAV MODE à gauche"},
  {t:"p", v:"L'écran tactique du RIO. Les fonctions se sélectionnent par les boutons-poussoirs qui entourent l'écran ; leur rôle change selon la page affichée. Le détail des pages est traité en section Navigation et en section Air-air."},

  {t:"h", v:"Planche de bord droite"},
  {t:"img", k:"rpanel", c:"Planche de bord droite"},
  {t:"tbl", head:["N°","Élément","Fonction"], rows:[
   ["1","Indicateur de balayage des ailes","Position programmée, commandée et réelle des ailes."],
   ["2","Coupe-feu moteur droit","Coupe l'alimentation carburant du moteur droit."],
   ["3","Horizon de secours","Attitude, indépendant des systèmes principaux."],
   ["4","Répétiteurs radio","Fréquences ou canaux des deux radios."],
   ["5","BDHI","Gisement, distance et cap."],
   ["6","Indicateur ALR-67","Les émetteurs radar détectés."],
   ["7","Poignée de largage de verrière","Largage manuel de la verrière."],
   ["8","Checklist décollage","Les points critiques avant de partir."]]},

  {t:"h", v:"Le poste arrière"},
  {t:"p", v:"Tu ne t'y assiéras probablement pas, mais c'est de là que JESTER travaille : radar, navigation, désignation, contre-mesures."},
  {t:"img", k:"rio", c:"Poste RIO du B(U)"},
  {t:"tbl", head:["N°","Zone"], rows:[
   ["1","Console latérale gauche"],
   ["2","Console verticale gauche"],
   ["3","Planche de bord gauche"],
   ["4","Panneau central"],
   ["5","Console centrale"],
   ["6","Puits de pieds"],
   ["7","Planche de bord droite"],
   ["8","Console verticale droite"],
   ["9","Console latérale droite"],
   ["10","Poignée de verrière"]]},

  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Mission d'entraînement, avion au parking, <b>moteurs coupés</b>.",
   "Ouvre le <b>manuel interactif in-game</b> et active le <b>click-to-explain</b> : survole un interrupteur, le jeu t'explique sa fonction.",
   "Fais le tour dans l'ordre des planches ci-dessus, tableau à l'appui.",
   "Repère les quatre zones où tu passeras 90 % de ton temps.",
   "Pour le détail commande par commande de chaque panneau, ouvre la section <b>Le cockpit</b> depuis la page d'accueil."]},
  {t:"note", k:"go", lbl:"Validation", v:"Tu situes les quatre zones principales et tu sais nommer les onze ensembles de la console gauche."},
  {t:"src", v:["manuel"]}
]},

{id:"a2", title:"Commandes et bindings",
 intro:"La moitié des vols ratés en reprise viennent d'un binding manquant découvert en l'air. Une heure au sol maintenant t'évite dix frustrations plus tard.",
 body:[
  {t:"note", k:"go", lbl:"Version pas à pas", v:"Cette leçon explique <b>quoi</b> assigner. Pour vérifier l'installation du mod, régler les courbes d'axes et les zones mortes avant de brancher le moindre bouton, va sur <a href='preparer-module-controles.html' style='color:var(--amber)'>Préparer le module et les contrôles</a> — à faire en tout premier, avant même cette leçon."},
  {t:"h", v:"La manette : le vrai poste de commande"},
  {t:"p", v:"Sur Tomcat, la manette des gaz porte bien plus que la poussée. C'est la pièce à cartographier en priorité sur ton HOTAS."},
  {t:"img", k:"throttle", c:"Manettes et commandes HOTAS"},
  {t:"tbl", head:["N°","Commande","Fonction et positions"], rows:[
   ["1","Aérofreins","<span class='pos'><b>EXT</b> — sortent progressivement tant que tu maintiens, se figent au relâchement.<br><b>RET</b> — rentrent.</span>","Speed brake extend"],
   ["2","Balayage des ailes","En manuel, tu ne peux que <b>reculer</b> les ailes au-delà de la position commandée par le calculateur.<span class='pos'><b>AUTO</b> — géré par le CADC selon le Mach.<br><b>FWD / AFT</b> — à la main.<br><b>BOMB</b> — commande 55° si les ailes sont plus en avant.</span>","Wing Sweep Auto Mode"],
   ["3","PLM","Verrouillage radar commandé par le pilote. Déconnecte le pilote automatique en appontage automatique.","—click"],
   ["4","CAGE/SEAM","Accrochage de l'AIM-9. Déconnecte la régulation automatique de vitesse.","CAGE-SEAM button"],
   ["5","Feux extérieurs","<span class='pos'><b>OFF</b> — feux éteints, feux d'approche à pleine intensité.<br><b>ON</b> — feux allumés, feux d'approche atténués.</span>","—click"],
   ["6","Alternat ICS","<span class='pos'><b>ICS</b> — parle au RIO. &nbsp;·&nbsp; <b>BOTH</b> — les deux radios.<br><b>UHF1</b> / <b>UHF2</b> — une radio à la fois.</span>","—click"]]},

  {t:"h", v:"Train, volets et freins"},
  {t:"img", k:"gear", c:"Panneau de commande du train"},
  {t:"tbl", head:["N°","Commande","Fonction et positions"], rows:[
   ["1","Poignée LDG GEAR","Train haut ou bas.<span class='pos'>Sortie de secours, poignée sur DOWN : enfoncer, tourner dans le sens horaire, tirer.</span>","Gears Up"],
   ["2","DOWN LOCK ORIDE","Signale l'appui sur les roues. Peut être relevé pour forcer le signal.","—click"],
   ["3","HYD ISOL","Isole train, direction de roue et freins du circuit commun.<span class='pos'><b>FLT</b> — en vol, isolés. &nbsp;·&nbsp; <b>T.O./LDG</b> — connectés.<br>Passe automatiquement sur T.O./LDG quand la poignée de train est basse.</span>","—click"],
   ["4","Voyant de transit","S'allume quand la position réelle du train ne correspond pas à la poignée."],
   ["5","Indicateur roues-volets","Positions des volets, becs, aérofreins et train."],
   ["6","EMERG STORES","Largage d'urgence de tous les emports.","—click"],
   ["7","NOSE STRUT","<span class='pos'><b>EXTD</b> — étend l'amortisseur avant, verrouille la barre de lancement.<br><b>OFF</b> — repos. &nbsp;·&nbsp; <b>KNEEL</b> — agenouille l'avion.</span>","—click"],
   ["8","BRAKE-PULL","Frein de parking. Tirer pour serrer.","Parking brake enabled, else disabed"],
   ["9","EJECT CMD","<span class='pos'><b>PILOT</b> — le pilote éjecte les deux. &nbsp;·&nbsp; <b>MCO</b> — chacun éjecte les deux.</span>","—click"]]},

  {t:"h", v:"Crosse d'appontage"},
  {t:"img", k:"hook", c:"Panneau de crosse"},
  {t:"tbl", head:["N°","Commande","Fonction"], rows:[
   ["1","Poignée HOOK","<span class='pos'><b>UP</b> — rentre et verrouille. &nbsp;·&nbsp; <b>DOWN</b> — descend par gravité.<br><b>EMERG DOWN</b> — tirer puis tourner en sens antihoraire : largage mécanique.</span>","Hook Extend"],
   ["2","Voyant de transit","S'allume tant que la crosse n'est pas dans la position commandée."],
   ["3","Munitions restantes","Décompte du canon M61A1, normalement 676 obus au départ."]]},

  {t:"h", v:"Balayage des ailes"},
  {t:"img", k:"wingsweep", c:"Indicateur de balayage des ailes"},
  {t:"tbl", head:["Élément","Lecture"], rows:[
   ["Aiguille de gauche","Position programmée — aussi <b>l'angle maximal vers l'avant</b> autorisé à ta vitesse et altitude."],
   ["Bande centrale","Position <b>commandée</b>."],
   ["Bande de droite","Position <b>réelle</b>."],
   ["Cinq fenêtres","Mode de fonctionnement en cours."]]},

  {t:"img", k:"launchbar", c:"Commande de barre de lancement et bouton d'abandon (catapulte)"},

  {t:"h", v:"La liste à binder, par priorité"},
  {t:"tbl", head:["Catégorie","Commandes"], rows:[
   ["Vital","Train, volets, aérofreins, crosse, freins de roue, direction de roue avant, trim, postcombustion."],
   ["Spécifique Tomcat","Balayage des ailes avant/arrière au pouce, mode BOMB, verrière, éjection."],
   ["Tactique","Désignation cible, sélection d'arme, largage de contre-mesures, menu JESTER, bouton contexte."]]},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Ouvre les commandes DCS et binde les trois catégories du tableau, dans l'ordre.",
   "Retourne dans le cockpit et <b>actionne chaque binding une fois</b>, en vérifiant l'effet à l'écran. Un binding non testé n'existe pas.",
   "Note ci-dessous ta liste finale : elle te servira de référence quand tu changeras de matériel."]},
  {t:"note", k:"warn", lbl:"Piège", v:"Le binding le plus souvent oublié est celui des contre-mesures. On s'en aperçoit toujours au premier missile."},
  {t:"src", v:["manuel"]}
]},

{id:"a3", title:"Travailler avec JESTER",
 intro:"Le Tomcat est un avion à deux équipiers. Tu ne pilotes pas seul : tu commandes un équipage. Presque tout ce qui touche au radar, à la navigation et à la désignation passe par ton RIO.",
 body:[
  {t:"h", v:"Ce que JESTER fait pour toi"},
  {t:"p", v:"Il gère le radar (modes, portée, verrouillages), l'alignement de la navigation, la saisie des points, la nacelle de désignation, le datalink et les contre-mesures. Sur les tâches longues comme l'alignement ou le démarrage, il peut travailler pendant que tu observes — une excellente façon d'apprendre une procédure avant de la faire soi-même."},
  {t:"h", v:"Le mécanisme réel du menu"},
  {t:"p", v:"Une seule touche <span class='bindtag' data-bind-cmd='Toggle Menu'></span> commande tout, en trois pressions successives."},
  {t:"tbl", head:["Pression","Résultat"], rows:[
   ["1ʳᵉ","Ouvre le menu <b>contextuel</b> : ce que JESTER propose selon la situation du moment."],
   ["2ᵉ","Ouvre le <b>menu principal</b> complet."],
   ["3ᵉ","Ferme le menu."]]},
  {t:"p", v:"Le contenu du menu contextuel change selon ta situation réelle :"},
  {t:"tbl", head:["Ta situation","Ce que propose la 1ʳᵉ pression"], rows:[
   ["Mode air-air, en vol","Le menu radar longue portée (BVR)."],
   ["Mode air-sol","Le menu armement air-sol."],
   ["Décollage ou atterrissage","Un menu spécifique à la phase en cours."]]},
  {t:"note", k:"", lbl:"Ce que ça change pour toi", v:"Tu n'as presque jamais besoin d'ouvrir le menu principal en vol : la première pression te donne déjà ce dont tu as besoin dans la plupart des cas, parce qu'elle sait dans quelle situation tu es."},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Avion au parking, moteurs coupés. Ouvre le menu JESTER et <b>parcours toute l'arborescence</b> sans rien déclencher.",
   "Note les trois ou quatre branches que tu utiliseras vraiment : radar, navigation, contre-mesures, communications.",
   "Teste la <b>première pression</b> dans trois situations : au sol moteurs coupés, au sol prêt à rouler, en vol. Observe qu'elle ne propose pas la même chose.",
   "Demande-lui de faire le <b>démarrage complet</b> à ta place et regarde les interrupteurs bouger. C'est ta première leçon de démarrage, gratuite.",
   "Écris ton propre lexique : pour chaque besoin fréquent, la phrase JESTER exacte à viser."]},
  {t:"note", k:"warn", lbl:"Piège", v:"Croire que JESTER anticipe. Il est compétent mais il attend des ordres : si tu ne demandes rien, il ne fait rien d'utile au moment critique."},
  {t:"src", v:["manuel"]}
]},

{id:"a4", title:"Démarrage à froid",
 intro:"Le démarrage n'est pas une corvée : c'est la séquence qui t'apprend l'architecture de l'avion. Électricité, puis air, puis moteurs, puis avionique.",
 body:[
  {t:"note", k:"go", lbl:"Version pas à pas", v:"Cette leçon explique <b>pourquoi</b> l'ordre compte. Pour la checklist complète case par case (avec les numéros de bouton de ton HOTAS), va sur <a href='demarrage-a-froid.html' style='color:var(--amber)'>Démarrage à froid, pas à pas</a> — c'est le tuto à faire en premier si tu débutes."},
  {t:"h", v:"L'ordre à retenir"},
  {t:"p", v:"Alimentation au sol ou APU pour avoir du courant. Air pour lancer les moteurs. Moteur droit puis moteur gauche. Génératrices en ligne. Avionique sous tension. Et surtout : <b>lancement de l'alignement de la navigation le plus tôt possible</b>."},
  {t:"img", k:"lconsole", c:"Console gauche — l'essentiel du démarrage s'y joue (légende en leçon 1)"},

  {t:"h", v:"Gestion carburant"},
  {t:"img", k:"fuelpanel", c:"Panneau de gestion carburant"},
  {t:"tbl", head:["N°","Commande","Fonction et positions"], rows:[
   ["1","QTY SEL","Choisit les réservoirs affichés sur les jauges.<span class='pos'><b>FEED</b> — nourrices et fuselage. &nbsp;·&nbsp; <b>WING</b> — voilure. &nbsp;·&nbsp; <b>EXT</b> — bidons.</span>"],
   ["2","FEED","Routage du carburant vers les moteurs. Verrouillé sur NORM par un cache."],
   ["3","WING/EXT TRANS","<span class='pos'><b>ORIDE</b> — force le transfert. &nbsp;·&nbsp; <b>AUTO</b> — normal. &nbsp;·&nbsp; <b>OFF</b> — coupé.</span>"],
   ["4","Voyant perche","S'allume quand la perche de ravitaillement n'est ni sortie ni rentrée complètement."],
   ["5","DUMP","Vidange carburant. Autorisée aérofreins rentrés, sans postcombustion, en vol.","Fueldump Dump"],
   ["6","REFUEL PROBE","<span class='pos'><b>ALL EXTD</b> — perche sortie, tous réservoirs.<br><b>FUS EXTD</b> — fuselage seul. &nbsp;·&nbsp; <b>RET</b> — rentrée.</span>","Refuel Probe extend & Refuel All, else Retract Probe"],
   ["7","ANTI SKID / SPOILER BK","<span class='pos'><b>BOTH</b> — anti-dérapage et freinage par spoilers. &nbsp;·&nbsp; <b>OFF</b> — coupés. &nbsp;·&nbsp; <b>SPOILER BK</b> — spoilers seuls.</span>","Antiskid & Spoiler BK - Both"],
   ["8","MASTER RESET","Réarme la détection de panne du calculateur d'air (CADC).","—click"],
   ["9","Position des gouvernes","Indicateur des spoilers, dérives et empennages."]]},

  {t:"h", v:"Surveiller les moteurs"},
  {t:"p", v:"Pendant le lancement, tu regardes trois choses : la montée du régime, la température, et la pression d'huile. Si l'une des trois ne se comporte pas comme prévu, tu coupes."},
  {t:"img", k:"lengine", c:"Poignée coupe-feu moteur gauche — tirer coupe le carburant ; l'extincteur est derrière"},
  {t:"img", k:"rengine", c:"Poignée coupe-feu moteur droit"},
  {t:"img", k:"oil", c:"Pressions d'huile — une aiguille par moteur. Plage normale : 25 à 65 psi. Voyant OIL PRESS sous 11 psi"},
  {t:"img", k:"hyd", c:"Pressions hydrauliques — circuits combiné et vol, plus les drapeaux SPOIL et EMER FLT HI"},

  {t:"h", v:"L'alignement de la navigation"},
  {t:"p", v:"L'alignement se pilote avec le sélecteur NAV MODE du PTID et se suit sur la page START du CDNU. Deux contraintes : la centrale a besoin du système d'armes, qui a besoin d'air prélevé sur les moteurs — donc l'alignement <b>ne peut pas aboutir avant que les moteurs tournent</b>. Et l'avion doit rester immobile."},
  {t:"img", k:"ptidalign", c:"Suivi de l'alignement sur le PTID"},
  {t:"tbl", head:["Position NAV MODE","Usage"], rows:[
   ["GND","Alignement au sol, à terre, avion immobile."],
   ["CV","Alignement sur porte-avions, tient compte du mouvement du pont."],
   ["NAV","Position de vol normale, une fois l'alignement terminé."],
   ["OFF","Système éteint."]]},
  {t:"note", k:"", lbl:"Raccourci qui vaut le détour", v:"Demande à JESTER de lancer l'alignement et choisis la qualité voulue. Un alignement rapide suffit pour un vol d'entraînement ; l'alignement fin ne se justifie que pour de la frappe sur coordonnées."},

  {t:"h", v:"Après démarrage"},
  {t:"p", v:"Il reste à configurer : écrans allumés, altimètre calé, gyro de secours érigé, radios et TACAN réglés, éclairage."},
  {t:"img", k:"procov", c:"Vue d'ensemble des checklists normales, intégrées au module"},
  {t:"img", k:"checklist", c:"Carte de checklist décollage, planche de bord droite"},

  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Premier passage : laisse <b>JESTER démarrer</b> pendant que tu regardes. Ne touche à rien.",
   "Deuxième passage : démarre toi-même, manuel ouvert sur le second écran, sans chronomètre.",
   "Troisième passage : démarre en te chronométrant. Note le temps.",
   "Recommence jusqu'à tomber sous les <b>8 minutes</b> de façon régulière.",
   "Écris ta séquence personnelle ci-dessous, dans tes mots."]},
  {t:"note", k:"warn", lbl:"Pièges", v:"Lancer l'alignement trop tard : tu attends au point d'arrêt pour rien. Bouger l'avion pendant l'alignement : tu recommences."},
  {t:"note", k:"go", lbl:"Validation", v:"Démarrage complet en moins de 8 minutes, sans relire tes notes."},
  {t:"src", v:["manuel"]}
]},

{id:"a5", title:"Roulage et décollage",
 intro:"On décolle d'une piste avant de toucher au porte-avions. Une variable difficile à la fois.",
 body:[
  {t:"h", v:"Avant de rouler"},
  {t:"tbl", head:["Réglage","Position"], rows:[
   ["Anti-dérapage / frein aérodynamique","Position terrain (BOTH).","Antiskid & Spoiler BK - Both"],
   ["HOOK BYPASS (console droite)","FIELD — pas CARRIER.","Lights Hook Bypass FIELD"],
   ["MODE du PDCP","T.O. — bascule la symbologie du HUD sur le format décollage.","—click"]]},
  {t:"p", v:"La roulette avant se braque avec un bouton au manche ; un témoin te confirme qu'elle est engagée."},
  {t:"img", k:"procov", c:"Vue d'ensemble des checklists normales — les points de roulage y figurent"},
  {t:"h", v:"Rouler"},
  {t:"p", v:"L'avion est lourd et long. Tu anticipes tes virages, tu roules lentement, et tu freines par petites touches. Sur le pont d'un porte-avions plus tard, cette discipline sera la différence entre rester à bord et tomber à l'eau."},
  {t:"h", v:"Décoller"},
  {t:"p", v:"Configuration décollage, ailes en automatique, plein gaz ou postcombustion selon la masse. Tu tires doucement à la vitesse de rotation, tu rentres le train dès que le taux de montée est positif, puis tu nettoies la configuration."},
  {t:"img", k:"gear", c:"Panneau de train (légende complète en leçon 2)"},
  {t:"h", v:"Lire le HUD en montée"},
  {t:"img", k:"hudcruise", c:"Le HUD, ici en croisière"},
  {t:"tbl", head:["N°","Élément","Fonction"], rows:[
   ["1","HUD","Symbologie de décollage, croisière, air-air, air-sol et atterrissage."],
   ["2","Capteur CTVS","Enregistre le HUD pour l'analyse des tirs."],
   ["3","MASTER CAUTION","Clignote au moindre changement sur le panneau d'alertes. Appuyer pour acquitter.","Master Caution Reset"],
   ["4","Indicateur virage-glissade","Taux de virage en haut, bille de glissade en bas."]]},
  {t:"note", k:"warn", lbl:"Pièges", v:"Cabrer trop tôt ou trop fort : le Tomcat frotte facilement la queue. Rentrer les volets trop bas ou trop lent."},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Trois décollages consécutifs, même terrain, même masse de carburant.",
   "Le quatrième avec les réservoirs pleins : observe la différence de distance et d'assiette.",
   "Après chaque décollage, tour de piste et retour au parking.",
   "Note ci-dessous ta configuration et tes repères de rotation."]},
  {t:"note", k:"go", lbl:"Validation", v:"Trois décollages de suite, sans toucher la queue et sans sortir de l'axe."},
  {t:"src", v:["manuel"]}
]},

{id:"a6", title:"Vol de base, AoA et DFCS",
 intro:"C'est la leçon la plus importante de la section. Le Tomcat se pilote à l'incidence, pas à la vitesse. Tout ce qui suivra repose sur ce que tu vas sentir ici.",
 body:[
  {t:"h", v:"L'incidence commande tout"},
  {t:"p", v:"L'indexeur d'incidence te dit en un coup d'œil si tu es trop rapide, trop lent, ou dans le créneau. En approche, c'est lui que tu regardes, pas le badin : à masse variable, la bonne vitesse change, mais la bonne incidence, jamais."},
  {t:"img", k:"aoa", c:"Indicateur d'incidence"},
  {t:"tbl", head:["Repère","Valeur","Usage"], rows:[
   ["Montée","5 unités","Montée initiale."],
   ["Croisière","8,5 unités","Vol de croisière."],
   ["Approche","15 unités","La référence : terrain comme bateau, quelle que soit ta masse."],
   ["Décrochage","29 unités","Limite haute."]]},

  {t:"h", v:"Badin et machmètre"},
  {t:"img", k:"airspeed", c:"Badin / machmètre"},
  {t:"tbl", head:["N°","Élément","Fonction"], rows:[
   ["1","Cadran","Entraîne les trois échelles de vitesse et de Mach."],
   ["2","Échelle extérieure","Vitesse indiquée jusqu'à 200 nœuds."],
   ["3","Échelle intérieure","De 200 à 850 nœuds. Masquée tant qu'elle ne s'applique pas."],
   ["4","Échelle de Mach","Se décale par rapport à la vitesse indiquée pour donner le bon Mach."],
   ["5","Index de vitesse","Repère réglable sur une vitesse voulue."],
   ["6","Index de Mach","Repère réglable sur un Mach voulu."],
   ["7","Index de Mach de sécurité","Mach limite calculé par le CADC."],
   ["8","Bouton d'index","Tirer/pousser pour choisir lequel des deux index tu règles."]]},

  {t:"h", v:"Altimètres"},
  {t:"img", k:"baroalt", c:"Altimètre servopneumatique"},
  {t:"tbl", head:["N°","Élément","Fonction"], rows:[
   ["1","Affichage","Trois tambours (10 000, 1 000, 100 pieds) plus une aiguille en centaines de pieds."],
   ["2","Bouton de calage","Règle la pression locale.<span class='pos'>Ce calage n'affecte que cet altimètre : les affichages pilotés par le CADC restent sur 29,92.</span>","—click"],
   ["3","Fenêtre de pression","Fenêtre de Kollsman : affiche le calage retenu."],
   ["4","Sélecteur de mode","<span class='pos'><b>RESET</b> — maintenir 3 s pour revenir en mode asservi.<br><b>STBY</b> — secours purement pneumatique.</span>"]]},
  {t:"note", k:"", lbl:"Erreurs à connaître", v:"À grande vitesse sous 10 000 pieds, les effets de pression faussent la lecture : jusqu'à <b>1 200 pieds</b> en transsonique et <b>4 000 pieds</b> en supersonique."},
  {t:"img", k:"radalt", c:"Radioaltimètre"},
  {t:"tbl", head:["N°","Élément","Fonction"], rows:[
   ["1","Bouton de commande","Alimentation, réglage du seuil d'alerte, lancement du test.","—click"],
   ["2","Drapeau OFF","Apparaît si l'appareil est éteint, sans alimentation, ou s'il perd l'accrochage sol."],
   ["3","Voyant d'alerte basse altitude","S'allume en rouge sous le seuil réglé."],
   ["4","Voyant de test","Vert pendant le test. Le test doit afficher 100 pieds ±10."],
   ["5","Index de seuil","Repère triangulaire marquant le seuil choisi."]]},

  {t:"h", v:"Attitude et gouvernes"},
  {t:"img", k:"adi", c:"Horizon de secours — un drapeau OFF apparaît si l'instrument est cagé ou sans alimentation"},
  {t:"img", k:"vvi", c:"Variomètre — une manœuvre brutale peut fausser momentanément l'indication"},
  {t:"img", k:"csurf", c:"Indicateur de position des gouvernes"},
  {t:"tbl", head:["N°","Indication","Lecture"], rows:[
   ["1","Spoilers","<span class='pos'><b>DN</b> — rentrés. &nbsp;·&nbsp; <b>Flèche haute</b> — sortis au-dessus de l'aile. &nbsp;·&nbsp; <b>Flèche basse</b> — braqués sous l'aile.</span>"],
   ["2","Dérives","Positions gauche et droite, repérées L et R."],
   ["3","Empennages","Positions gauche et droite, repérées L et R."]]},

  {t:"h", v:"Le DFCS"},
  {t:"p", v:"Le Tomcat est un avion lourd aux ailes immenses, taillé pour tourner à basse vitesse. Les commandes de vol numériques le rendent prévisible aux hautes incidences : l'avion prévient avant de décrocher, et décroche proprement. Ce n'est pas une protection absolue : c'est une marge, pas un filet."},
  {t:"img", k:"vdicruise", c:"L'écran vertical (VDI) en croisière"},
  {t:"tbl", head:["N°","Commande","Fonction"], rows:[
   ["1","HUD BRT / BARO SET","Luminosité du HUD et calage barométrique HUD/VDI.","—click"],
   ["2","VDI BRT / CONT","Luminosité et contraste du VDI.","—click"],
   ["3","Refroidissement Sidewinder","Commande manuelle du refroidissement de l'autodirecteur AIM-9.","—click"],
   ["4","Préparation missiles","Commande la préparation des AIM-54 et AIM-7.","—click"],
   ["5","Mode missile","<span class='pos'><b>NORM</b> — tir normal. &nbsp;·&nbsp; <b>BRSIT</b> — tir en boresight.</span>","—click"],
   ["6","Voyants du VDI","Alertes datalink et appontage automatique."],
   ["7","Affichages spécifiques","État des emports et points de navigation."]]},

  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Altitude de sécurité, 15 000 pieds minimum, zone dégagée.",
   "Virages soutenus à différents facteurs de charge, en tenant une <b>incidence constante</b>. Ne regarde pas le badin.",
   "Régimes lents : ralentis progressivement en configuration lisse, puis en configuration atterrissage.",
   "Approche du décrochage, en douceur, et récupération. Répète jusqu'à ce que ce ne soit plus une surprise.",
   "Teste l'autopilot et ses modes de tenue.",
   "Note tes repères : quelle incidence pour quoi, où l'avion commence à protester."]},
  {t:"note", k:"warn", lbl:"Pièges", v:"Piloter à la vitesse. Et croire que le DFCS te rend intouchable : il repousse la limite, il ne l'efface pas."},
  {t:"note", k:"go", lbl:"Validation", v:"Tu tiens un virage soutenu à incidence constante sans jamais regarder le badin."},
  {t:"src", v:["manuel"]}
]},

{id:"a7", title:"Retour terrain et atterrissage",
 intro:"L'atterrissage terrain, c'est l'appontage sans la pression. Tout ce que tu construis ici sera réutilisé tel quel au bateau.",
 body:[
  {t:"h", v:"La configuration"},
  {t:"p", v:"Train, volets, et la carte de checklist du cockpit pour ne rien oublier. Crosse rentrée sur terrain, HOOK BYPASS sur FIELD, anti-dérapage actif — l'inverse exact de ce que tu feras au bateau."},
  {t:"img", k:"lndgchk", c:"Carte de checklist atterrissage, planche de bord gauche"},
  {t:"img", k:"gear", c:"Panneau de train (légende complète en leçon 2)"},
  {t:"h", v:"L'approche"},
  {t:"p", v:"Deux règles suffisent. L'assiette vise le point de toucher, la poussée règle le taux de descente. Et tu arrives <b>déjà stabilisé en incidence</b> avant le dernier virage : ce que tu n'as pas stabilisé en amont, tu ne le rattraperas pas en finale."},
  {t:"img", k:"aoa", c:"L'indexeur d'incidence — en approche, ton instrument principal (repères en leçon 6)"},
  {t:"h", v:"Les voyants à surveiller"},
  {t:"img", k:"cautionlt", c:"Voyants du montant de pare-brise gauche"},
  {t:"tbl", head:["Voyant","Signification"], rows:[
   ["WHEELS","Clignote si le train n'est pas sorti et verrouillé, volets sous 10° et une manette sous 85 %."],
   ["BRAKES","Panne d'anti-dérapage ou de freins. S'allume aussi quand le frein de parking est serré."],
   ["ACLS/AP","L'appontage automatique ou le pilote automatique est déconnecté."],
   ["NWS ENGA","Direction de roue avant engagée."],
   ["AUTO THROT","La régulation automatique de vitesse s'est déconnectée."]]},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Circuit complet : vent arrière, base, finale. Cinq fois.",
   "Varie la masse de carburant : léger, moyen, lourd. Constate que la <b>vitesse</b> change et que l'<b>incidence</b> ne change pas.",
   "Fais trois remises de gaz volontaires : décision franche, plein gaz, pas d'hésitation.",
   "Termine par cinq approches d'affilée en tenant l'incidence à une demi-unité près.",
   "Note tes repères de circuit : altitudes, vitesses, points de virage."]},
  {t:"note", k:"warn", lbl:"Piège", v:"Approcher trop vite. C'est l'erreur la plus courante, et la seule vraiment punie au porte-avions."},
  {t:"note", k:"go", lbl:"Validation", v:"Cinq approches consécutives à l'incidence de référence, plus ou moins une demi-unité. Tu es prêt pour la section B."},
  {t:"src", v:["manuel"]}
]},

{id:"a8", title:"Ressources vidéo",
 intro:"Le B(U) vient de sortir : les tutoriels vidéo dédiés commencent tout juste à apparaître. Voici ce qui existe au moment où j'écris ceci.",
 body:[
  {t:"video", id:"h9gieCO6uzs", c:"F-14B(U): Changes (U) Need To Know — les changements clés côté pilote, pour t'orienter vite dans le nouveau cockpit."},
  {t:"video", id:"6rmzbgYudiw", c:"F-14B(U): Overview — HUD, A2A, PTID, ECMD, CMDS, JDAM (DTC/ME/LANTIRN) Guide — vue d'ensemble complète de toutes les nouveautés du module."},
  {t:"note", k:"", lbl:"À savoir", v:"Ces vidéos couvrent large plutôt que d'aller au fond de chaque système — c'est normal si peu après la sortie. Reviens sur cette page dans quelques semaines : les tutoriels spécialisés arriveront."}
]}

]},

{id:"b1", title:"Comprendre le système",
 intro:"Avant de toucher au clavier, il faut comprendre l'architecture du système. Ça t'évitera de chercher des commandes là où elles n'existent pas.",
 body:[
  {t:"h", v:"L'EGI, ta référence de position"},
  {t:"p", v:"Le B(U) navigue avec une EGI : une centrale à gyrolaser couplée à un récepteur GPS. Un filtre combine les deux et donne une position qui, avec le GPS, ne dérive pratiquement plus. C'est ce qui rend possibles les frappes sur coordonnées de la section F."},
  {t:"img", k:"egischem", c:"Schéma du système EGI : centrale inertielle et GPS fusionnés."},
  {t:"note", k:"warn", lbl:"Le piège qui piège tout le monde", v:"Le CAP, à droite du siège RIO, <b>ne sert pas à la navigation</b> sur le B(U) : ses fonctions de saisie sont ailleurs. Toute la navigation passe par le CDNU. Si une source que tu consultes te fait taper des points dans le CAP, elle décrit un autre avion — ignore-la."},
  {t:"img", k:"cap", c:"Le CAP — toujours présent, mais retiré de la boucle de navigation sur le B(U)."},
  {t:"h", v:"Le CDNU : le nouveau centre de commande"},
  {t:"p", v:"Le CDNU (Control Display Navigation Unit) est sur la console gauche du RIO. C'est un petit écran à pages avec un clavier, exactement dans l'esprit d'une calculatrice de navigation d'avion de ligne. Tu y accèdes aux pages par des touches dédiées (FPLN, PROG, DIR, RNAV, IDX…) et tu valides tes saisies avec les touches latérales, les LSK, alignées de part et d'autre de l'écran."},
  {t:"img", k:"cdnu", c:"Le CDNU, sur la console gauche du RIO"},
  {t:"tbl", head:["N°","Élément","Fonction"], rows:[
   ["1","Touches LSK","Huit touches de sélection de ligne, numérotées 1 à 8 de gauche à droite. Elles lancent une fonction, déposent la donnée du scratchpad, changent de mode ou ouvrent la page indiquée.","—rio"],
   ["2","BRT","Luminosité de l'écran.","—rio"],
   ["3","ON / OFF","Alimentation du CDNU.","—rio"],
   ["4","Scratchpad","Ligne du bas, entre crochets : affiche ce que tu tapes avant de le déposer."],
   ["5","Touches de fonction","F1 à F7 — fonctions liées à l'avion, sans passer par une page. MENU affiche la liste.","—rio"],
   ["6","Clavier alphanumérique","Chiffres et lettres. Les touches N, S, E et W sont mises en évidence pour la saisie de coordonnées.","—rio"],
   ["7","Touches fléchées","Défilement vertical et horizontal des pages.","—rio"],
   ["8","Touches dédiées","FPLN (plan de vol), PROG (progression), DIR (direct), RNAV, MARK.","—rio"]]},
  {t:"tbl", head:["Touche","Ouvre"], rows:[
   ["FPLN","Le plan de vol — insertion et gestion des waypoints.","—rio"],
   ["PROG","La page de progression — distance, temps, vitesse sol vers le point actif.","—rio"],
   ["DIR","Saut direct vers un point de la route, hors séquence.","—rio"],
   ["RNAV","Le format d'affichage des coordonnées (DMM, DMS…).","—rio"],
   ["IDX","La page d'index — porte d'entrée vers les fonctions moins fréquentes, dont START.","—rio"]]},
  {t:"note", k:"", lbl:"Le principe à retenir", v:"Tout se fait en deux temps. D'abord tu tapes ta donnée : elle apparaît dans le <b>scratchpad</b>, la ligne du bas entre crochets. Ensuite tu appuies sur la <b>LSK</b> en face du champ où tu veux la déposer. Taper puis déposer : c'est toute la logique du CDNU."},
  {t:"h", v:"Où lire la navigation"},
  {t:"p", v:"Le CDNU sert à saisir. Pour lire ta position dans le vol, tu as plusieurs écrans : le PTID côté tactique, le HSD (situation horizontale) et le HUD côté pilote, et le bon vieux BDHI à aiguilles. Le point actif de ta route apparaît sur le PTID sous forme d'un symbole en « os de chien »."},
  {t:"img", k:"navoverview", c:"Vue d'ensemble du système de navigation du B(U)."},
  {t:"img", k:"navpanels", c:"Les panneaux de navigation côté RIO."},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Aucune manipulation. Cette leçon est de la lecture.",
   "Ouvre le CDNU en jeu et repère physiquement : l'écran, les LSK, le clavier alphanumérique, le scratchpad, les touches dédiées FPLN / PROG / DIR / RNAV / IDX.",
   "Appuie sur <code>MENU</code> pour voir la liste des fonctions, puis sur <code>IDX</code> pour voir la page d'index. Navigue sans rien saisir.",
   "Note ci-dessous, dans tes mots, la différence entre une touche dédiée, une LSK et le scratchpad."]},
  {t:"src", v:["manuel"]}
]},

{id:"b2", title:"Aligner l'EGI",
 intro:"L'alignement est ce qui bloque tout démarrage : tant qu'il n'est pas fini, l'avion ne sait pas où il est et rien de tactique ne fonctionne. Bonne nouvelle : sur le B(U), c'est plus simple qu'avant, parce que le système choisit lui-même son mode d'alignement.",
 body:[
  {t:"h", v:"Le sélecteur qui commande tout"},
  {t:"p", v:"L'alignement se pilote avec le sélecteur NAV MODE sur le PTID. Dès que tu le sors de la position OFF, l'EGI démarre son alignement et choisit automatiquement le mode adapté selon ta situation : au sol frein serré, en mouvement, avec ou sans GPS. Tu n'as pas à sélectionner de mode d'alignement toi-même."},
  {t:"img", k:"ptidalign", c:"Suivi de l'alignement sur le PTID."},
  {t:"table", head:["Position NAV MODE","Usage"], rows:[
    ["GND","Alignement au sol, à terre, avion immobile."],
    ["CV","Alignement sur porte-avions (tient compte du mouvement du pont)."],
    ["NAV","Position de vol normale, une fois l'alignement terminé."],
    ["OFF","Système éteint."]]},
  {t:"note", k:"warn", lbl:"La contrainte physique", v:"L'alignement a besoin du système d'armes, qui a besoin d'air de refroidissement prélevé sur les moteurs. Conséquence concrète : <b>les deux moteurs doivent tourner et le sélecteur d'air être sur les deux moteurs</b> avant que l'alignement puisse aboutir. C'est pour ça qu'on démarre les moteurs tôt. Et l'avion doit rester immobile au sol pendant toute la durée."},
  {t:"h", v:"Suivre la qualité"},
  {t:"p", v:"Sur la page START du CDNU (via IDX puis LSK1, puis flèche bas pour la page 2/2), tu lis la qualité d'alignement en milles nautiques par heure de dérive, le nombre de satellites captés, et la solution de position active : GPS, mélangée, ou inertielle seule. Plus la valeur de dérive est basse, meilleur est l'alignement. Pour un vol d'entraînement, tu n'as pas besoin d'attendre la perfection."},
  {t:"img", k:"egimodes", c:"Modes et états du système EGI."},
  {t:"img", k:"egidisp", c:"Affichages EGI sur le CDNU."},
  {t:"note", k:"", lbl:"Le raccourci JESTER", v:"Tu peux demander à JESTER de lancer et de gérer l'alignement, et choisir la qualité voulue. C'est parfait pour apprendre : tu le laisses faire une fois en observant la page START, puis tu refais toi-même."},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Mission au sol, à terre. Démarre les moteurs (section A, leçon 4) et vérifie le sélecteur d'air sur les deux moteurs.",
   "Mets le sélecteur NAV MODE du PTID sur <code>GND</code>. L'alignement démarre.",
   "Ouvre la page START 2/2 du CDNU et <b>observe la dérive descendre</b> et les satellites se caler.",
   "Une fois l'alignement suffisant, passe le sélecteur sur <code>NAV</code>.",
   "Refais l'exercice sur un porte-avions avec la position <code>CV</code> et compare.",
   "Note le temps d'alignement réel et les valeurs de dérive que tu obtiens."]},
  {t:"note", k:"go", lbl:"Validation", v:"Tu lances un alignement complet, tu le suis sur la page START, et tu passes en NAV sans aide extérieure."},
  {t:"src", v:["manuel"]}
]},

{id:"b3", title:"Saisir un waypoint",
 intro:"Le cœur de la section. Une fois que tu sais créer un point proprement, tu peux construire n'importe quelle route et, plus tard, guider une JDAM. La procédure est précise, mais courte une fois comprise.",
 body:[
  {t:"h", v:"Le format des coordonnées"},
  {t:"p", v:"Le CDNU attend des coordonnées en degrés et minutes décimales (DMM). Le format exact, sans aucun espace ni séparateur, est le suivant :"},
  {t:"note", k:"", lbl:"Format DMM", v:"<code>Nddmm.mmm Wdddmm.mmm</code> — soit N ou S, quatre chiffres (deux de degrés, deux de minutes), puis E ou W, cinq chiffres (trois de degrés, deux de minutes). Les décimales de minute sont optionnelles. Exemple réel tiré du manuel : <code>N4358.257W10700.347</code>."},
  {t:"note", k:"warn", lbl:"Les pièges de saisie", v:"<b>Zéros de tête obligatoires</b> : il n'y a pas de séparateur entre degrés et minutes, donc chaque chiffre compte. Pas d'espace, pas de « / », aucun caractère entre latitude et longitude. Une erreur d'un chiffre te déplace d'un kilomètre — ce qui, pour une JDAM, est un ratage complet."},
  {t:"img", k:"cdnu", c:"Le CDNU. Tu vas taper dans le scratchpad, puis déposer avec une LSK."},
  {t:"h", v:"Insérer le premier point d'une route vide"},
  {t:"p", v:"Quand la route est vide, la page FPLN affiche « End of Flight Plan ». Le premier point que tu insères devient le point actif."},
  {t:"proc", v:[
   "Appuie sur la touche dédiée <code>FPLN</code> pour afficher la page du plan de vol.",
   "Tape ta coordonnée au format DMM. Elle apparaît dans le <b>scratchpad</b> en bas.",
   "Vérifie-la caractère par caractère. C'est le moment de corriger, avec <code>CLR</code>.",
   "Appuie sur la <b>LSK gauche</b> en face de « End of Flight Plan ». Le point s'insère.",
   "En vol, le système demande confirmation (« CONFIRM FLT PLN CHG ») : réappuie sur la même LSK pour valider."]},
  {t:"img", k:"navmatrix", c:"Matrice des affichages de navigation : où ton point apparaît une fois saisi."},
  {t:"h", v:"Insérer un point au milieu d'une route"},
  {t:"proc", v:[
   "Page <code>FPLN</code>, tape la nouvelle coordonnée dans le scratchpad.",
   "Appuie sur la LSK du waypoint <b>devant lequel</b> tu veux insérer le nouveau. Il se glisse juste avant.",
   "Pour supprimer un point : tape un tiret <code>-</code> dans le scratchpad, puis appuie sur la LSK du point à effacer. Les suivants remontent."]},
  {t:"note", k:"", lbl:"Numérotation", v:"Les points préparés en mission portent les numéros 01 à 50. Ceux que tu crées en vol commencent à 51. Quand tu supprimes un point, les autres gardent leur numéro d'origine — l'ordre de vol, lui, est celui de la liste FPLN, pas celui des numéros."},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Alignement fait, avion au sol. Ouvre la page <code>FPLN</code>.",
   "Crée un premier waypoint de zéro, à partir de coordonnées lues sur la carte F10 ou le kneeboard.",
   "Vérifie qu'il apparaît sur le PTID (symbole « os de chien ») et sur le HUD.",
   "Crée-en deux autres, puis intercale-en un au milieu, puis supprime-en un.",
   "Note ci-dessous la <b>séquence de touches exacte</b> — c'est le genre de chose qu'on oublie entre deux sessions, alors écris-la vraiment."]},
  {t:"note", k:"go", lbl:"Validation", v:"Tu crées un waypoint depuis une route vide en moins de 90 secondes, sans relire tes notes."},
  {t:"src", v:["manuel"]}
]},

{id:"b4", title:"Suivre une route",
 intro:"Créer des points ne sert à rien si l'avion ne t'y emmène pas. Cette leçon relie ta route à ce que tu vois devant toi, et t'apprend à choisir comment l'avion enchaîne les points.",
 body:[
  {t:"h", v:"Les trois modes d'enchaînement"},
  {t:"p", v:"Sur la page FPLN, une LSK bascule le mode de séquencement du point actif. C'est ce qui décide comment l'avion passe d'un waypoint au suivant."},
  {t:"table", head:["Mode","Comportement"], rows:[
    ["AUTO","L'avion anticipe le virage vers le point suivant, façon navigation aérienne classique. Pratique en croisière — mais déconseillé en vol basse altitude, car il coupe les virages."],
    ["OFLY","L'avion vise le survol exact du point avant de séquencer. C'est le mode du vol tactique basse altitude, quand tu dois vraiment passer sur le point."],
    ["MAN","Aucun enchaînement automatique. Le guidage reste sur le point actif jusqu'à ce que tu avances manuellement avec la fonction DIR."]]},
  {t:"note", k:"warn", lbl:"À savoir", v:"Le mode AUTO « lisse » les virages pour rester dans un couloir aérien théorique. En basse altitude ou pour une frappe où le point compte vraiment, c'est OFLY qu'il te faut."},
  {t:"h", v:"Lire la route en vol"},
  {t:"p", v:"Le HSD, côté pilote, te donne la vue de dessus : cap commandé, écart de route, distance au point. La page PROG du CDNU, côté RIO, donne les chiffres : distance, temps au point, vitesse sol, dérive. Sur le HUD, le repère de direction t'amène au point actif."},
  {t:"img", k:"hsd", c:"Le HSD — situation horizontale, la vue de dessus de ta route"},
  {t:"tbl", head:["N°","Commande","Fonction"], rows:[
   ["1","BRT","Luminosité du HSD.","—click"],
   ["2","HDG","Règle le repère de cap, en mode TACAN.","—click"],
   ["3","CRS","Règle la route désirée, en modes manuel et TACAN.","—click"],
   ["4","TEST","Réinitialise le HSD après coupure de protection et affiche la mire de test.","—click"],
   ["5","Indicateur BIT","Drapeaux blancs en cas de panne. Se réarme en tournant dans le sens horaire.","—click"]]},
  {t:"img", k:"hudcruise", c:"Le HUD en croisière : suis le repère de direction vers le point actif."},
  {t:"img", k:"navdisplay", c:"Affichage de navigation côté RIO."},
  {t:"h", v:"Aller direct à un point"},
  {t:"p", v:"La touche DIR permet de sauter directement à un point de ta route, en laissant les points précédents passer dans l'historique. C'est ta commande de secours quand le plan change : un détour, une menace, une nouvelle cible."},
  {t:"proc", v:[
   "Appuie sur <code>DIR</code>.",
   "Fais défiler jusqu'au point voulu et sélectionne-le avec la LSK gauche.",
   "Ce point devient le point actif ; l'avion t'y emmène directement. Les points sautés passent dans l'historique (les cinq derniers restent rappelables)."]},
  {t:"h", v:"Marquer un point en vol"},
  {t:"p", v:"La touche MARK enregistre ta position actuelle : utile pour noter un objectif que tu viens de survoler. Le point atterrit dans le scratchpad, tu le ranges ensuite dans la liste MARK via la page IDX."},
  {t:"img", k:"mark", c:"Fonction MARK — enregistrer une position en vol."},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Construis une route de quatre points (leçon B3).",
   "Vole-la en <code>AUTO</code>, puis recommence en <code>OFLY</code> : sens la différence dans les virages.",
   "En vol, survole un point d'intérêt et enregistre-le avec <code>MARK</code>.",
   "Utilise <code>DIR</code> pour sauter directement au dernier point, puis reviens au marqué.",
   "Exercice final : coupe le PTID et rentre au terrain au BDHI et au HSD seuls.",
   "Note tes repères de lecture : où tu regardes pour quoi."]},
  {t:"note", k:"go", lbl:"Validation", v:"Navigation de quatre points et retour au terrain, sans jamais ouvrir la carte F10."},
  {t:"src", v:["manuel"]}
]},

{id:"b5", title:"TACAN et sources de guidage",
 intro:"Dernière brique : comprendre que plusieurs systèmes peuvent te guider en même temps, et savoir lequel écoute ton HUD. C'est la source de confusion classique — « pourquoi mon HUD ne pointe pas où je veux ? »",
 body:[
  {t:"h", v:"Quatre sources, une seule écoutée à la fois"},
  {t:"p", v:"Le B(U) a quatre sources de guidage : l'EGI (ta route CDNU), le calculateur de mission pour les modes d'attaque et de destination, le BDHI, et le TACAN. Le HUD et le HSD suivent l'une ou l'autre selon ce qui est sélectionné. La bascule principale se fait sur le panneau TACAN CMD <span class='bindtag unbound' title='Pas de bind HOTAS : action à la souris/VR dans le cockpit'>Clic cockpit</span>, qui alterne entre <b>TACAN</b> et <b>EGI</b>."},
  {t:"img", k:"navoverview", c:"Le système de navigation et ses sources de guidage."},
  {t:"note", k:"", lbl:"La règle simple", v:"Si ton HUD ne t'emmène pas vers ton waypoint CDNU, vérifie d'abord le panneau TACAN CMD : il est probablement sur TACAN au lieu d'EGI. C'est l'explication dans neuf cas sur dix."},
  {t:"h", v:"Le TACAN"},
  {t:"p", v:"Le TACAN te guide vers une balise (une station sol, un porte-avions, un ravitailleur). Tu règles la fréquence sur le panneau TACAN, tu laisses chauffer, et le BDHI comme le HSD te donnent le cap et la distance vers la balise. Le principe est simple et stable : régler la fréquence, laisser chauffer, lire cap et distance."},
  {t:"img", k:"tacan", c:"Panneau TACAN."},
  {t:"img", k:"bdhi", c:"Le BDHI — cap et distance, à aiguilles"},
  {t:"tbl", head:["N°","Élément","Lecture"], rows:[
   ["1","Aiguille n° 2","Cap magnétique vers la station TACAN accordée."],
   ["2","Rose des caps","Cap magnétique actuel de l'avion."],
   ["3","Aiguille n° 1","Gisement de la station UHF/ADF accordée."],
   ["4","Compteur de distance","Distance oblique à la station TACAN, en nautiques."]]},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Règle un TACAN vers une balise sol et suis-la au BDHI jusqu'à la survoler.",
   "Bascule le panneau TACAN CMD entre <code>TACAN</code> et <code>EGI</code> et observe comment le HUD change de source.",
   "En fin de vol, règle le TACAN du porte-avions et sers-t'en pour rentrer vers le bateau — ça prépare la section C.",
   "Note tes fréquences TACAN utiles et le réflexe de vérification EGI/TACAN."]},
  {t:"note", k:"go", lbl:"Validation", v:"Tu sais dire, à tout instant, quelle source guide ton HUD — et la changer. Tu es prêt pour la section C."},
  {t:"src", v:["manuel"]}
]},
{id:"b6", title:"Ressources vidéo",
 intro:"La navigation par CDNU/EGI est probablement le système le mieux couvert en vidéo à ce jour, grâce à un tutoriel dédié au DTC (Data Transfer Cartridge).",
 body:[
  {t:"video", id:"ZbV8J47WP1k", c:"Tomcat GAME CHANGER! DCS F-14B(U) Basic DTC Tutorial — Navigation, PP JDAM's & CMDS — couvre la préparation de mission via le DTC, directement lié à cette section."},
  {t:"vidlink", url:"https://f14.manuals.heatblur.se/f14bu/systems/nav_com/cdnu/control_display_navigation_unit.html", c:"Chapitre CDNU du manuel en ligne Heatblur", src:"Référence texte officielle, mise à jour en continu"}
]}

]},

{id:"c1", title:"Départ catapulte",
 intro:"Le Tomcat est un avion embarqué : le porte-avions n'est pas un défi bonus, c'est son milieu naturel. On commence par en sortir, ce qui est bien plus facile que d'y revenir.",
 body:[
  {t:"note", k:"go", lbl:"Version pas à pas", v:"Cette leçon explique le <b>pont et la catapulte</b>. Pour la checklist complète depuis les moteurs froids — ce qui change par rapport à un aérodrome, avec les numéros de bouton de ton HOTAS — va sur <a href='demarrage-porte-avions.html' style='color:var(--amber)'>Démarrage et catapultage, pas à pas</a>."},
  {t:"h", v:"Rouler sur le pont"},
  {t:"p", v:"Le pont est encombré et se termine dans l'eau. Tu suis les directeurs (les marshallers), tu roules lentement, et tu gardes les ailes en sur-balayage à 75° tant que tu manœuvres au parking, pour ne pas accrocher un autre appareil."},
  {t:"img", k:"wingsweep", c:"Indicateur de balayage des ailes"},
  {t:"tbl", head:["Élément","Lecture"], rows:[
   ["Aiguille de gauche","Position programmée — aussi l'angle maximal vers l'avant autorisé à ta vitesse et altitude."],
   ["Bande centrale","Position <b>commandée</b>."],
   ["Bande de droite","Position <b>réelle</b>."],
   ["Cinq fenêtres","Mode de fonctionnement en cours."]]},
  {t:"p", v:"Sur le pont, sur-balayage à 75° jusqu'à la mise en place sur la catapulte."},
  {t:"h", v:"Se mettre en place"},
  {t:"p", v:"Une fois aligné sur la catapulte, tu déploies la barre de lancement et tu passes en configuration décollage : ailes sorties à 20°, volets et becs sortis, trim réglé. Le contournement de crosse doit être sur CARRIER <span class='bindtag' data-bind-cmd='Lights Hook Bypass CARRIER'></span>."},
  {t:"img", k:"launchbar", c:"Commande de barre de lancement et bouton d'abandon."},
  {t:"img", k:"gear", c:"Panneau de train — la barre de lancement se gère depuis cette zone (légende complète en section A, leçon 2)"},
  {t:"h", v:"Le coup de catapulte"},
  {t:"proc", v:[
   "Plein gaz, voire postcombustion selon la masse et le vent sur le pont.",
   "Passe rapidement les commandes en revue : gouvernes libres, paramètres moteurs verts.",
   "Salut au directeur pour signaler que tu es prêt.",
   "<b>Mains à l'écart du manche</b> pendant le lancement. Le Tomcat rote pratiquement tout seul.",
   "Après le catapultage : rotation naturelle, train rentré dès taux de montée positif, puis nettoyage de la configuration."]},
  {t:"note", k:"warn", lbl:"Pièges", v:"Toucher le manche pendant le lancement : tu induis une oscillation dangereuse à basse hauteur. Et décoller trop lourd pour le vent du jour : vérifie ta masse contre les conditions."},
  {t:"img", k:"hudcruise", c:"Le HUD une fois en montée (légende en section A, leçon 5)"},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Mission au départ catapulte. Trois catapultages consécutifs, sans intervention hasardeuse au manche.",
   "Un quatrième réservoirs pleins : observe la différence de comportement en sortie.",
   "Note ta configuration de décollage et ton repère de rotation."]},
  {t:"note", k:"go", lbl:"Validation", v:"Trois catapultages de suite, mains propres, sans oscillation."},
  {t:"src", v:["manuel"]}
]},

{id:"c2", title:"La théorie de l'appontage",
 intro:"Avant de tourner autour du bateau, il faut comprendre ce qu'on cherche à faire. L'appontage n'est pas un atterrissage précis : c'est trois paramètres tenus simultanément jusqu'au fil d'arrêt. Cette leçon est de la lecture — la pratique vient après.",
 body:[
  {t:"h", v:"Les trois paramètres"},
  {t:"p", v:"Tout l'appontage tient dans un balayage permanent entre trois choses : la <b>boule</b> (ton plan de descente, lue sur le miroir optique du bateau), l'<b>alignement</b> (rester dans l'axe de la piste oblique, qui se dérobe puisque le bateau avance), et l'<b>incidence</b> (l'AoA, ta vitesse d'approche). Tu ne fixes jamais un seul des trois : tu balaies les trois en boucle."},
  {t:"img", k:"aoa", c:"L'indexeur d'incidence — un de tes trois yeux en approche bateau (repères chiffrés en section A, leçon 6)"},
  {t:"note", k:"", lbl:"Le mantra", v:"« Meatball, lineup, angle of attack » — boule, axe, incidence. Répété en boucle à voix haute, ça t'empêche de te fixer sur un seul paramètre et d'oublier les deux autres."},
  {t:"h", v:"Le DLC : la commande secrète du Tomcat"},
  {t:"p", v:"Le Tomcat a une commande que peu d'avions possèdent : le DLC (Direct Lift Control), une molette au pouce qui te fait monter ou descendre sur le plan <b>sans changer d'assiette</b>. Le manuel est catégorique : toutes les approches devraient se faire DLC engagé — sans lui, la tenue du plan se dégrade nettement. Tu l'engages une fois les volets complètement sortis, jamais pendant le cycle des volets."},
  {t:"note", k:"warn", lbl:"Discipline moteur", v:"Les F110 répondent vite et fort. Le manuel insiste : évite de sur-contrôler la poussée. Petites corrections, jamais de grands coups de manette. La sensibilité de la manette est ton pire ennemi les premières fois."},
  {t:"h", v:"La page AWL du PTID — tes aiguilles de guidage"},
  {t:"p", v:"Le RIO ouvre la page AWL (« All Weather Landing ») du PTID en approche. Elle affiche ton incidence, ta vitesse verticale, et des aiguilles de guidage — ILS ou ACLS selon ce qui est accroché."},
  {t:"tbl", head:["Élément","Ce qu'il te dit"], rows:[
   ["Repère de vitesse verticale","Ta vitesse de descente, en centaines de pieds par minute."],
   ["Aiguilles ILS ou ACLS","Écart par rapport au plan de descente et à l'axe. ACLS remplace ILS dès qu'il est accroché."],
   ["Portée TACAN","Ta distance au bateau."],
   ["Altitude radar","Ta hauteur réelle au-dessus de l'eau — plus fiable que le barométrique près du pont."],
   ["Repère d'incidence","Ton incidence, en complément direct de l'indexeur physique."]]},
  {t:"note", k:"warn", lbl:"Signes de perte de guidage", v:"Si les données ACLS deviennent invalides, les aiguilles se figent au centre. Une remise de gaz commandée par le bateau affiche une croix « X » sur les aiguilles. Si aucun message n'arrive pendant plus de deux secondes, l'indication <b>TILT</b> apparaît — c'est ton signal pour repasser en pilotage visuel."},
  {t:"h", v:"Le DFCS en appontage : ACL et VEC/PCD"},
  {t:"p", v:"Le sélecteur VEC/PCD/ACL du panneau DFCS (section Cockpit) <span class='bindtag unbound' title='Pas de bind HOTAS : action à la souris/VR dans le cockpit'>Clic cockpit</span> prend tout son sens ici. En position <b>ACL</b>, engagée par le bouton NWS du manche, l'avion se laisse guider automatiquement jusqu'au pont par le bateau — c'est l'appontage entièrement couplé. La position <b>VEC/PCD</b> laisse le datalink commander seulement le roulis et le tangage, un cran moins automatisé. Les deux dépendent d'un guidage ACLS valide : sans lui, ni l'un ni l'autre ne s'engage."},
  {t:"h", v:"Le circuit CASE I en chiffres"},
  {t:"pat", v:PATTERN_SVG, cap:"Circuit visuel CASE I. Les valeurs sont celles du manuel Heatblur ; elles te donnent des repères, pas une contrainte au pied près."},
  {t:"table", head:["Étape","Repères du manuel"], rows:[
    ["Break","800 ft, 300 à 350 kt. Intervalle d'environ la moitié du temps souhaité entre deux appareils."],
    ["Vent arrière","Descente et stabilisation à 600 ft. Ralentir à 15 unités d'incidence (ou vitesse on-speed). Sortir train, volets, becs, crosse. Engager le DLC une fois les volets sortis."],
    ["Le 180","Amorcé à 1 à 1,2 nm par le travers de la plateforme LSO. Inclinaison de 27 à 28°."],
    ["Le 90","Arrivée vers 450 à 500 ft."],
    ["Acquisition de la boule","Vers 0,6 nm. Ne pas descendre sous 300 ft avant d'avoir la boule."],
    ["Dans l'axe (groove)","Temps optimal sur le plan : 15 à 18 secondes."]]},
  {t:"note", k:"", lbl:"Configuration de référence", v:"Le bateau attend un Tomcat en config standard : ailes à 20°, volets et becs sortis. Toute autre configuration doit être signalée au LSO, car elle change les conditions de vent sur le pont."},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Rien à piloter. Lis cette leçon deux fois.",
   "Regarde une vidéo d'appontage en gardant les trois paramètres en tête : repère la boule, l'axe, l'indexeur.",
   "Récite le circuit CASE I dans l'ordre, avec ses chiffres, jusqu'à le connaître.",
   "Note ci-dessous, dans tes mots, ce que fait le DLC et pourquoi il change tout."]},
  {t:"note", k:"go", lbl:"Validation", v:"Tu peux réciter le circuit CASE I et expliquer les trois paramètres sans relire."},
  {t:"src", v:["manuel"]}
]},

{id:"c3", title:"Voler le circuit",
 intro:"Maintenant tu voles ce que tu viens d'apprendre. On construit le circuit morceau par morceau, sans chercher à réussir l'appontage du premier coup — l'objectif ici, c'est d'arriver dans l'axe, stabilisé, à la bonne incidence.",
 body:[
  {t:"h", v:"La configuration, dans l'ordre"},
  {t:"p", v:"Le point qui sauve tout : tu arrives dans le dernier virage <b>déjà stabilisé en incidence</b>. Ce que tu n'as pas stabilisé en vent arrière et dans le 180, tu ne le rattraperas jamais dans l'axe. La configuration se fait donc entièrement avant le 90."},
  {t:"img", k:"lndgchk", c:"Carte de checklist atterrissage, à compléter avant le 180."},
  {t:"img", k:"hook", c:"Panneau de crosse d'appontage"},
  {t:"tbl", head:["N°","Commande","Fonction"], rows:[
   ["1","Poignée HOOK","<span class='pos'><b>UP</b> — rentre et verrouille. &nbsp;·&nbsp; <b>DOWN</b> — descend par gravité.<br><b>EMERG DOWN</b> — tirer puis tourner en sens antihoraire : largage mécanique.</span>","Hook Extend"],
   ["2","Voyant de transit","S'allume tant que la crosse n'est pas dans la position commandée. Peut rester allumé à grande vitesse à cause du soulèvement aérodynamique."],
   ["3","Munitions restantes","Décompte du canon M61A1."]]},
  {t:"img", k:"gear", c:"Train et volets (légende complète en section A, leçon 2)"},
  {t:"h", v:"Tenir l'incidence à la manette"},
  {t:"p", v:"En approche, la logique s'inverse par rapport au vol normal : l'assiette vise l'axe, et c'est la <b>poussée qui règle le plan de descente</b> (aidée du DLC). Tu ne piques pas pour descendre : tu réduis un cheveu de poussée ou tu donnes une touche de DLC vers le bas. Corrections petites et permanentes."},
  {t:"img", k:"vdicruise", c:"Le VDI — repère de plan et d'assiette en approche (légende en section A, leçon 6)"},
  {t:"note", k:"warn", lbl:"L'erreur numéro un", v:"Arriver trop vite. C'est la seule erreur vraiment punie au bateau : trop rapide, la crosse rebondit sur les brins ou tu passes au-dessus. L'incidence, pas la vitesse."},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Mission avec le bateau, météo calme, avion léger (peu de carburant). On simplifie tout au début.",
   "Vole le circuit complet mais <b>vise juste l'arrivée dans l'axe</b>, stabilisé, à 15 unités d'incidence. Ne cherche pas encore le brin.",
   "Remets les gaz volontairement à chaque passage : tu travailles l'approche, pas le toucher.",
   "Recommence jusqu'à arriver dans l'axe stabilisé de façon régulière.",
   "Note tes repères réels : à quelle vitesse tu passes chaque étape, où tu amorces le 180."]},
  {t:"note", k:"go", lbl:"Validation", v:"Tu arrives dans l'axe, dans le groove, stabilisé en incidence, cinq fois de suite — sans forcément apponter."},
  {t:"src", v:["manuel"]}
]},

{id:"c4", title:"Poser sur le pont",
 intro:"La dernière marche. Tu ajoutes le toucher à ce que tu maîtrises déjà. Il n'y a pas de raccourci ici : seulement du volume. Vingt appontages ratés valent mieux qu'un tutoriel de plus.",
 body:[
  {t:"h", v:"Le balayage final"},
  {t:"p", v:"Dans l'axe, tu balaies en boucle : boule, axe, incidence. Corrections minuscules. Si la boule descend, une touche de poussée et de DLC vers le haut. Si tu dérives, une petite correction d'axe au manche, accompagnée d'un léger palonnier pour contrer le lacet. Jamais de grand geste."},
  {t:"note", k:"", lbl:"Le geste qui compte", v:"Au toucher : <b>plein gaz militaire systématique</b>. Tu remets les gaz à chaque fois, avant même de savoir si tu as accroché un brin. Si la crosse tient, l'avion s'arrête ; si elle rebondit, tu es déjà en train de redécoller. Ce réflexe est non négociable — c'est lui qui transforme un raté en simple remise de gaz. Sélectionner la pleine poussée coupe aussi automatiquement le DLC et rentre les aérofreins."},
  {t:"img", k:"csurf", c:"Position des gouvernes — utile pour voir tes entrées en finale (légende en section A, leçon 6)"},
  {t:"note", k:"warn", lbl:"Deux pièges mortels", v:"Piquer du nez juste avant le toucher : tu augmentes fortement le risque de rebond de crosse. Et vouloir casser un fort taux de chute au manche seul près du ramp : tu abîmes l'arrière de l'avion. Un taux de chute se casse à la poussée et au DLC, pas à l'assiette."},
  {t:"h", v:"Après le toucher"},
  {t:"p", v:"Si tu accroches : plein gaz maintenu, manche légèrement tiré, tu laisses les brins t'arrêter. Une fois immobilisé, tu réduis, tu remontes la crosse sur ordre, et tu dégages le pont vers un parking en suivant les directeurs. Si tu rebondis (bolter) : tu es déjà à fond, tu redécolles, et tu reprends le circuit pour un nouveau passage."},
  {t:"h", v:"Ce que tu fais maintenant"},
  {t:"proc", v:[
   "Reprends la mission de la leçon C3, toujours en météo calme.",
   "Cette fois, va au bout : cherche le brin. Plein gaz au toucher, à chaque passage.",
   "Compte tes réussites sur dix. Ne vise pas la perfection : vise la progression.",
   "Quand tu passes cinq sur dix, complique : plus de carburant, mer formée, pont qui bouge.",
   "Note après chaque série : qu'est-ce qui t'a fait rater ? Boule, axe, ou incidence ?"]},
  {t:"note", k:"go", lbl:"Validation", v:"Cinq appontages réussis sur dix en conditions calmes, puis huit sur dix. Tu tiens le bateau — le reste du module s'ouvre à toi."},
  {t:"src", v:["manuel"]}
]},
{id:"c5", title:"Ressources vidéo",
 intro:"Aucun tutoriel d'appontage spécifique au B(U) n'existe encore : le circuit CASE I et la technique de base n'ont pas changé, donc les tutoriels du Tomcat classique restent valables pour la mécanique de vol. Seul le DLC et les aiguilles PTID/AWL vus dans cette section sont propres au B(U).",
 body:[
  {t:"vidlink", url:"https://www.youtube.com/watch?v=UvY7XIz-3_Q", c:"DCS F-14 Tomcat Case I Carrier Landing Tutorial", src:"Tomcat classique — la mécanique du circuit CASE I reste identique"},
  {t:"vidlink", url:"https://www.youtube.com/watch?v=bXHqEC04_78", c:"Using DLC for that perfect trap", src:"Focus sur la technique DLC — directement utile pour cette section"}
]}

]},
